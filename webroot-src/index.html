    <script>
        /**判断是否为手机端 */
        var isMobile = function () {
            var userAgentInfo = navigator.userAgent;
            var mobileAgents = ["Android", "iPhone", "SymbianOS", "Windows Phone", "iPad", "iPod"];
            var mobile_flag = false;
            //根据userAgent判断是否是手机
            for (var v = 0; v < mobileAgents.length; v++) {
                if (userAgentInfo.indexOf(mobileAgents[v]) > 0) {
                    mobile_flag = true;
                    break;
                }
            }
            var screen_width = window.screen.width;
            var screen_height = window.screen.height;
            //根据屏幕分辨率判断是否是手机
            if (screen_width < 500 && screen_height < 800) {
                mobile_flag = true;
            }
            return mobile_flag;
        };
        // BettaPay: mobile redirect disabled. The /Phone Vue app uses WebSockets,
        // which don't traverse the remote HTTP proxy; the responsive desktop UI is
        // used for both local and remote access.
        // if (isMobile()) { window.location.href = "./Phone/index.html#/"; }

    </script>

    <script>




        dayjs.extend(window.dayjs_plugin_isSameOrAfter);
        //var exptime = dayjs().add(-60, "minute");//截止时间
        //var time = dayjs();
        //if (time.isSameOrAfter(exptime)) {
        console.log('isSameOrAfter 测试完毕');
        //}


        setLanguage();
        setAllAttrVal();

        layui.use(['jquery', 'layer', 'miniAdmin', 'faceAPI'], async function () {
            var $;
            var faceAPI;

            $ = layui.jquery;
            var layer = layui.layer,
                miniAdmin = layui.miniAdmin,
                faceAPI = layui.faceAPI;

            //检查是否有Token
            if (faceAPI.GetJWTToken() == "") {
                faceAPI.GotoLogin(false);
                return;
            }

            // 从后台获得菜单
            //  var language = localStorage.getItem('language')?localStorage.getItem('language'):'';
            // console.log('[ getCurrentLanguage().menus ] >', getCurrentLanguage().menus)

            const getSNFn = () => {
                return new Promise((resolve, reject) => {
                    $.ajax({
                        type: 'get',
                        url: '/api/GetDeviceSN',
                        success: function (result) {
                            resolve(result);
                        },
                        error(err) {
                            reject(err);
                        }
                    });
                })
            }
            function GetFuncList() {
                return new Promise((resolve, reject) => {
                    //获取设备功能列表
                    faceAPI.AjaxPOSTJson({
                        url: '/api/Device/FunctionList',
                        success: function (result) {
                            resolve(result);
                            if (result.result == true) {

                                faceAPI.DeviceFunctionList = result.content;
                                HideFunction();
                            }

                        },
                        error: function (err) {
                            reject(err);
                        }

                    });
                })

            }
            // BettaPay: render the admin shell even if a startup call is slow, hung,
            // or failed. A hung request (common over the remote tunnel) must never block
            // miniAdmin.render — otherwise the loading overlay spins forever. Cap the
            // wait at 8s, then render regardless (menu shows all items if FunctionList
            // hasn't returned; it's reconciled when it does).
            await Promise.race([
                (async () => {
                    try {
                        await getSNFn().then(async (result) => {
                            if (result.result == true) {
                                SetLanguageDeviceSN(result.content);
                                setLanguage();
                                $("#deviceSn").html(result.content);
                                await GetFuncList();
                            }
                        });
                    } catch (e) { console.warn('[bettapay] startup API error:', e); }
                })(),
                new Promise(function (r) { setTimeout(r, 8000); })
            ]);
            // faceAPI.DeviceFunctionList.Face=false;
            // faceAPI.DeviceFunctionList.Lift=false;
            // faceAPI.DeviceFunctionList.WIFI=false;
            // faceAPI.DeviceFunctionList.AlarmClock=false;
            let menus = getCurrentLanguage().menus;

            function HideFunction() {
                let menus = getCurrentLanguage().menus;
                if (faceAPI?.DeviceFunctionList) {
                    const child = menus.menuInfo[0].child || [];
                    // console.log('[ menuInfo ] >', child)
                    // 从 child 数组中找出 id为 300 的设备管理菜单，并修改其 child 数组，去除不支持的功能
                    let deviceMenu = child.find((item => item.id == 300))
                    // console.log('[ deviceMenu ] >', deviceMenu)



                    // TimingLocked 门禁功能--定时锁定
                    let doorfunMenu = deviceMenu.child.find((item => item.id == 308)) //门禁功能菜单
                    if (!faceAPI.DeviceFunctionList.TimingLocked) {
                        doorfunMenu.child = doorfunMenu.child.filter((item => item.id != 420)) //定时锁定
                    };
                    //Face 人脸识别
                    if (!faceAPI.DeviceFunctionList.Face) {
                        deviceMenu.child = deviceMenu.child.filter((item => item.id != 403)) //人脸识别
                    };
                    // Lift 电梯功能
                    if (!faceAPI.DeviceFunctionList.Lift) {
                        deviceMenu.child = deviceMenu.child.filter((item => item.id != 406)) //电梯功能
                    };

                    // 网络设置
                    let networkMenu = deviceMenu.child.find((item => item.id == 404)) //网络设置菜单
                    if (!faceAPI.DeviceFunctionList.WIFI) {
                        networkMenu.child = networkMenu.child.filter((item => item.id != 415)) //网络设置
                    }
                    // 响铃闹钟设置
                    if (!faceAPI.DeviceFunctionList.AlarmClock) {
                        deviceMenu.child = deviceMenu.child.filter((item => item.id != 309)) //响铃闹钟设置
                    }

                    var VideoCall = faceAPI?.DeviceFunctionList?.VideoCall || false;
                    var SIP = faceAPI?.DeviceFunctionList?.SIP || false;

                    //关闭 视频对讲菜单
                    if (!VideoCall && !SIP) {
                        deviceMenu.child = deviceMenu.child.filter((item => item.id != 405)) //视频对讲
                    }


                    console.log('[ deviceMenu ] >', deviceMenu)
                    menus.menuInfo[0].child[3] = deviceMenu;
                }
            }
            // 移除元素
            function removeElement(selector) {
                // console.log('[ selector ] >', selector)
                // 检查selector是否以'.'开头，如果是，则按class选择器处理
                if (selector.startsWith('.')) {
                    var elements = document.querySelectorAll(selector);
                    elements.forEach(function (element) {
                        element.style.display = 'none';
                        // element.parentNode.removeChild(element); // 移除每个匹配的元素
                    });
                } else {
                    // 否则，按ID选择器处理
                    var element = document.getElementById(selector);
                    if (element) {
                        element.style.display = 'none';
                        // element.parentNode.removeChild(element); // 移除元素
                    }
                }
            }
            faceAPI.removeElement = removeElement;
            // console.log('[ faceAPI ] >', faceAPI)






            var options = {
                iniUrl: menus,    // 初始化接口
                //  clearUrl: "/SystemMenu/GCMemory", // 缓存清理接口
                renderPageVersion: false,    // 初始化页面是否加版本号
                bgColorDefault: false,      // 主题默认配置
                multiModule: true,          // 是否开启多模块
                menuChildOpen: false,       // 是否默认展开菜单
                loadingTime: 1,
                // 初始化加载时间
                pageAnim: true,             // 切换菜单动画
                //ajaxHeaders:{//添加 headers
                //    ClientLanguage:language
                //}
            };
            miniAdmin.render(options);



            $('.login-out').on("click", function () {
                var load_index = layer.load(1, { shade: [0.5, '#FFF'] });

                faceAPI.Ajax({
                    type: 'Get',
                    url: '/api/User/Logout',
                    success: function (result) {
                        layer.close(load_index);
                        layer.msg(getLanguage('Login.l14'), function () {
                            faceAPI.GotoLogin(false);
                        });
                    }
                })


            });

            var sn = getLanguageDeviceSN();
            if (sn.length > 0) {
                $("#deviceSn").html(sn);
            }




            faceAPI.StopOnlineAuthentication = false;
            //在线验证Token是否有效
            OnlineAuthentication();

            //token 自动续期任务
            setInterval(OnlineAuthentication, 10 * 60 * 1000); //10分钟检查一次




            //检查是否已登录，未登录则跳转登陆页面
            function OnlineAuthentication() {
                if (faceAPI.StopOnlineAuthentication) return;

                faceAPI.Ajax({
                    type: 'Get',
                    url: '/api/User/CheckLoginToken',
                    success: function (result) {
                        if (result.result == false) {
                            faceAPI.GotoLogin(true, true);
                            return;
                        }
                        var extension = result.content;
                        faceAPI.userDetail = result.content;

                        //console.log('token 的过期时间：' + dayjs.unix(extension).format('YYYY-MM-DD HH:mm:ss'));

                        var exptime = dayjs.unix(extension).add(-60, "minute");//截止时间
                        var nowtime = dayjs();

                        if (nowtime.isSameOrAfter(exptime)) {
                            console.log('token 即将过期，开始续期');
                            Refresh_Token();
                        }
                    },
                    error: function (xhr, status, error) {
                        window.location = 'page/login.html';
                    }
                })
            }

            function Refresh_Token() {
                faceAPI.Ajax({
                    type: 'Get',
                    url: '/api/User/TokenExtension',
                    success: function (result) {
                        if (result.result == false) {
                            faceAPI.GotoLogin(true, true);
                            return;
                        }
                        else {
                            //token 续期成功
                            var extension = result.content;
                            var exptime = dayjs.unix(extension).format('YYYY-MM-DD HH:mm:ss')
                            console.log('token 新的过期时间：' + exptime);
                        }
                    }
                })
            }


        });
    </script>
