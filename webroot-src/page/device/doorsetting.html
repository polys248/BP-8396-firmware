<script>
    layui.use(['form', 'laydate', 'table', 'miniPage', 'element', 'faceAPI'], function () {
        setLanguage();
        setAllAttrVal();
        var faceAPI = layui.faceAPI;
        var form = layui.form;
        var $ = layui.$;
        var formdata;


        function LoadData() {
            var parameter = {
                "Door": true
            };
            faceAPI.AjaxPOSTJson({
                url: '/api/Device/GetDetail',
                data: parameter,
                success: function (rst) {
                    if (rst != null && rst.result) {

                        formdata = rst.content;


                        if (formdata.DailyLimit > 0) {
                            formdata.UseDailyLimit = 1;
                        } else {
                            formdata.UseDailyLimit = 0;
                        }
                        switchDivHide(formdata.UseDailyLimit, "DailyLimit");
                        switchDivHide(formdata.OverdueRemind, "OverdueRemind_Day");

                        form.val("device_DoorSetting_div_filter", formdata);
                    };
                }
            });
        }
        LoadData();
        form.render();
        form.on('submit(data-save-btn)', function (data) {

            layer.confirm(getLanguage("Doorsetting.d4"), { icon: 3 }, function (index, layero, that) {
                var postdata = data.field;
                postdata.AccessType = postdata.AccessType == '1' ? 1 : 0;
                postdata.CardBytes = Number(postdata.CardBytes);
                postdata.FreeOpen = postdata.FreeOpen == '1' ? 1 : 0;
                postdata.MultiPerson = Number(postdata.MultiPerson);
                postdata.OpenInterval = Number(postdata.OpenInterval);
                postdata.OpenInterval_SaveRecord = postdata.OpenInterval_SaveRecord == '1' ? 1 : 0;
                postdata.OverdueRemind = postdata.OverdueRemind == '1' ? 1 : 0;
                postdata.OverdueRemind_Day = Number(postdata.OverdueRemind_Day);
                postdata.Relay = postdata.Relay == '1' ? 1 : 0;
                postdata.ReleaseTime = Number(postdata.ReleaseTime);
                postdata.DelayOpenDoorTime = Number(postdata.DelayOpenDoorTime);
                postdata.VerificationType = Number(postdata.VerificationType);
                postdata.WGContent = Number(postdata.WGContent);
                postdata.WgFormat = Number(postdata.WgFormat);
                postdata.WgBytesSort = Number(postdata.WgBytesSort);

                postdata.UseDailyLimit = postdata.UseDailyLimit == '1' ? 1 : 0;
                postdata.DailyLimit = Number(postdata.DailyLimit);
                if (postdata.UseDailyLimit == 0) {
                    postdata.DailyLimit = 0;
                }

                delete postdata.UseDailyLimit

                //启动遮罩层
                var waitLayerIndex = layer.load(1, { shade: [0.5, '#FFF'] });

                faceAPI.AjaxPOSTJson({
                    data: postdata,
                    url: '/api/device/UpdateParameter',
                    success: function (result) {
                        layer.close(waitLayerIndex)

                        if (result.result == false) {
                            layer.alert(result.error, { icon: 2 });
                        }
                        else {
                            formdata = data.field;
                            layer.alert(getLanguage("Doorsetting.d5"), { icon: 1 });
                        }
                    }
                });
                layer.close(index)
            });

        });
        $("#data-reset-btn").on('click', function () {

            layer.confirm(getLanguage("Doorsetting.d6"), { icon: 3, btn: ["Yes", "No"] }, function (index, layero, that) {
                LoadData();
                layer.close(index)
            });

        });

        form.on('switch(OverdueRemind)', function (data) {


            var models = form.val("device_DoorSetting_div_filter");
            models.OverdueRemind = models.OverdueRemind == "1" ? 1 : 0;
            switchDivHide(models.OverdueRemind, "OverdueRemind_Day");


            return false;
        });

        form.on('switch(UseDailyLimit)', function (data) {


            var models = form.val("device_DoorSetting_div_filter");
            models.UseDailyLimit = models.UseDailyLimit == "1" ? 1 : 0;
            switchDivHide(models.UseDailyLimit, "DailyLimit");


            return false;
        });

        function switchDivHide(value, filterName) {

            var elems = $('div[lay-filter="device_DoorSetting_div_filter"] div[lay-filter="' + filterName + '"]')

            if (value == 0) {
                elems.addClass("layui-hide");

            }
            else {
                elems.removeClass("layui-hide");
            }
            form.render();
        }



        faceAPI.ShowMouseTipMessageBox("device_DoorSetting_div_filter", layer);
        faceAPI.CheckInputBox();

        {
            var DailyLimit = false, OverdueRemind = false;
            var DelayOpenDoorTime = false;
            var MultiPerson = false;//组合开门
            var VerificationType = false;//组合验证
            var WGOutput = false;//WG输出
            var Card = false;//支持刷卡
            var VisitorRootPassword = false;//访客密码根密码
            var LCD = false;//短消息
            if (faceAPI?.DeviceFunctionList) {
                // faceAPI.DeviceFunctionList.BodyTemperature=false;
                DailyLimit = faceAPI?.DeviceFunctionList.DailyLimit;
                OverdueRemind = faceAPI?.DeviceFunctionList.OverdueRemind;
                DelayOpenDoorTime = faceAPI?.DeviceFunctionList.DelayOpenDoorTime;
                MultiPerson = faceAPI?.DeviceFunctionList.MultiPerson;
                VerificationType = faceAPI?.DeviceFunctionList.VerificationType;
                WGOutput = faceAPI?.DeviceFunctionList.WGOutput;
                Card = faceAPI?.DeviceFunctionList.Card;
                LCD = faceAPI?.DeviceFunctionList.LCD;
                VisitorRootPassword = faceAPI?.DeviceFunctionList.VisitorRootPassword;
                if (DelayOpenDoorTime == undefined) {
                    DelayOpenDoorTime = false;
                }

            }


            if (!DailyLimit) {
                faceAPI.removeElement('.FunctionList_DailyLimit');
            }
            if (!OverdueRemind) {
                faceAPI.removeElement('.FunctionList_OverdueRemind');
            }
            if (!DelayOpenDoorTime) {
                faceAPI.removeElement('.FunctionList_DelayOpenDoorTime');
            }

            if (!MultiPerson) {
                faceAPI.removeElement('.FunctionList_MultiPerson');
            }

            if (!VerificationType) {
                faceAPI.removeElement('.FunctionList_VerificationType');
            }

            if (!WGOutput) {
                faceAPI.removeElement('.FunctionList_WGOutput');
            }
            if (!Card) {
                faceAPI.removeElement('.FunctionList_Card');
            }
            //短消息
            if (!LCD) {
                faceAPI.removeElement('.FunctionList_LCD');
            }
            if (!VisitorRootPassword) {
                faceAPI.removeElement('.FunctionList_VisitorRootPassword');
            }


        }
    });
</script>
