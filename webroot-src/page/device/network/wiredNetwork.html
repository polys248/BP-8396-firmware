

<style>
    #device_NetworkWired_div label {
        width: 250px;
    }

    .layui-form-pane .layui-input-block {
        margin-left: 250px;
        left: -1px;
    }

    .divwidth {
        width: 1850px;
    }

    .status-black {
        margin-left: 10px
    }

    .divpadding {
        padding-right: 20px
    }

    .aligncenter {
        display: flex;
        justify-content: center;
        align-items: center;
    }
</style>
<div class="layui-form layuimini-form  layui-form-pane" id="device_NetworkWired_div" lay-filter="device_NetworkWired_div_filter">
    <div class="layui-bg-gray" style="padding: 10px;">
        <div class="layui-row layui-col-space15">

            <div class="layui-col-md12">
                <div class="layui-card">

                    <div class="layui-card-body">

                        <div class="layui-form-item">
                            <label class="layui-form-label" language='device.d204'>开关</label>
                            <div class="layui-input-inline">
                                <input type="checkbox" name="UseWired" lay-skin="switch"
                                       data-lang='lay-text' lay-text="启用|禁用" value="1" id="device.d401">
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label"> DHCP</label>
                            <div class="layui-input-inline">
                                <input type="checkbox" name="WiredDHCP" lay-skin="switch" 
                                       data-lang='lay-text' lay-text="启用|禁用" value="1" id="device.d402">

                            </div>
                        </div>

                        <div class="layui-form-item">
                            <label class="layui-form-label">MAC</label>
                            <div class="layui-input-inline">

                                <input type="text" name="WiredMAC" autocomplete="off" disabled
                                       class="layui-input">
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">IP</label>
                            <div class="layui-input-inline">

                                <input type="text" name="WiredIP" autocomplete="off" maxlength="15"  IPFormat
                                       lay-verify="required" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label" language='device.d205'> 子网掩码</label>
                            <div class="layui-input-inline">

                                <input type="text" name="WiredIPMask" autocomplete="off" maxlength="15"  IPFormat
                                       lay-verify="required" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label" language='device.d206'> 网关</label>
                            <div class="layui-input-inline">

                                <input type="text" name="WiredGteway" autocomplete="off" maxlength="15"  IPFormat
                                       lay-verify="required" class="layui-input">

                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label"> DNS</label>
                            <div class="layui-input-inline">

                                <input type="text" name="WiredDNS" autocomplete="off" maxlength="15"  IPFormat
                                       lay-verify="required" class="layui-input">
                            </div>
                        </div>


                    </div>
                </div>
            </div>
            <div class="layui-col-md12">
                <div class="layui-card">

                    <div class="layui-card-body">
                        <div class="layui-btn-container aligncenter">
                            <button type="submit" class="layui-btn layui-btn-normal" lay-submit
                                    lay-filter="data-save-btn" language='device.d224'>
                                <i class="layui-icon"></i> 保存
                            </button>
                            <button type="reset" class="layui-btn layui-btn-danger" id="data-reset-btn" language='timingLock.t2'>
                                <i class="layui-icon"></i> 刷新
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    layui.use(['form', 'laydate', 'table', 'miniPage', 'element', 'faceAPI'], function () {
        setLanguage();
        setAllAttrVal();
        var faceAPI = layui.faceAPI;
        var form = layui.form;
        var $ = layui.$;
        var laydate = layui.laydate;
        var formdata;

        form.render();

        function LoadData() {
            var parameter = {
                "Network": true,
            };
            faceAPI.AjaxPOSTJson({
                data: parameter,
                url: '/api/Device/GetDetail',
                success: function (rst) {
                    if (rst != null && rst.result) {
                        formdata = rst.content;
                        form.val("device_NetworkWired_div_filter", formdata);
                    };
                }
            });
        }
        LoadData();

        form.on('submit(data-save-btn)', function (data) {

            layer.confirm(getLanguage("wired.w1"), { icon: 3 }, function (index, layero, that) {
                var postdata = data.field;
                postdata.UseWired = postdata.UseWired == '1' ? 1 : 0;
                postdata.WiredDHCP = postdata.WiredDHCP == '1' ? 1 : 0;

                delete postdata["WiredMAC"];

                //启动遮罩层
                var waitLayerIndex = layer.load(1, { shade: [0.5, '#FFF'] });

                faceAPI.AjaxPOSTJson({
                    data: postdata,
                    url: '/api/device/UpdateParameter',
                    success: function (result) {
                        layer.close(waitLayerIndex);

                        if (result.result == false) {
                            layer.alert(result.error, { icon: 2 });
                        }
                        else {
                            formdata = data.field;
                            layer.alert(getLanguage("Sever.s3"), { icon: 1 });
                        }
                    }
                });
                layer.close(index);
            });

        });
        $("#data-reset-btn").on('click', function () {
            layer.confirm(getLanguage("wired.w2"), { icon: 3, btn: ["Yes", "No"] }, function (index, layero, that) {
                LoadData();
                layer.close(index)
            });
        });

        faceAPI.ShowMouseTipMessageBox('device_NetworkWired_div_filter', layer);
        faceAPI.CheckInputBox();
    });
</script>
