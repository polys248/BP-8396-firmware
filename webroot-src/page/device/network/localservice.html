<script>
    layui.use(['form', 'laydate', 'table', 'miniPage', 'element', 'faceAPI'], function () {
        setLanguage();
        setAllAttrVal();
        var faceAPI = layui.faceAPI;
        var form = layui.form;
        var $ = layui.$;
        var laydate = layui.laydate;
        var formdata;
        form.render();
        function LoadData() {
            var parameter = {
                "Network": true,
            };
            faceAPI.AjaxPOSTJson({
                data: parameter,
                url: '/api/Device/GetDetail',
                success: function (rst) {
                    if (rst != null && rst.result) {
                        formdata = rst.content;
                        form.val("device_NetworkOption_div_filter", formdata);
                    };
                }
            });
        }
        LoadData();
        function CheckIsHEX(str) {
            // 将字符串转换为大写
            const upperCaseStr = str.toUpperCase();
            // 使用正则表达式检查是否为有效的十六进制字符串
            const hexPattern = /^[0-9A-F]+$/;
            return hexPattern.test(upperCaseStr);
        }
        function CheckIsNumString(str) {
            // 将字符串转换为大写
            const upperCaseStr = str.toUpperCase();
            // 使用正则表达式检查是否为有效的数字字符串
            const hexPattern = /^\d+$/;
            return hexPattern.test(upperCaseStr);
        }
        form.on('submit(data-save-btn)', function (data) {
            var postdata = data.field;
            // postdata.UseWebPage = postdata.UseWebPage == '1' ? 1 : 0;
            postdata.HTTPPort = parseInt(postdata.HTTPPort);
            postdata.HTTPSPort = parseInt(postdata.HTTPSPort);
            postdata.WebPageUseSSL = postdata.WebPageUseSSL == '1' ? 1 : 0;


            postdata.UseUDP = postdata.UseUDP == '1' ? 1 : 0;
            postdata.UDPPort = parseInt(postdata.UDPPort);

            postdata.UseTCP = postdata.UseTCP == '1' ? 1 : 0;
            postdata.TCPPort = parseInt(postdata.TCPPort);

            postdata.UseTCPSSL = postdata.UseTCPSSL == '1' ? 1 : 0;
            postdata.TCPSSLPort = parseInt(postdata.TCPSSLPort);

            postdata.UseIPV6_UDP = postdata.UseIPV6_UDP == '1' ? 1 : 0;
            postdata.IPv6_UDPPort = parseInt(postdata.IPv6_UDPPort);

            postdata.UseIPV6_TCP = postdata.UseIPV6_TCP == '1' ? 1 : 0;
            postdata.IPv6_TCPPort = parseInt(postdata.IPv6_TCPPort);

            postdata.UseIPV6_TCPSSL = postdata.UseIPV6_TCPSSL == '1' ? 1 : 0;
            postdata.IPv6_TCPSSLPort = parseInt(postdata.IPv6_TCPSSLPort);

            postdata.UseDataEncryption = parseInt(postdata.UseDataEncryption);
            if (postdata.EncryptionKey && postdata.EncryptionKey != "") {
                if (postdata.EncryptionKey.length < 4 || postdata.EncryptionKey.length > 128) {
                    layer.alert(getLanguage("LocalService.EncryptionKeyPassword_err"), { icon: 2 });//加密秘钥由1-128个字符组成，请重新输入!
                    return false;
                }
            }
            if (postdata.UseRC4Encryption && (!postdata.EncryptionKey || postdata.EncryptionKey == "")) {
                layer.alert(getLanguage("LocalService.EncryptionKeyPassword_err"), { icon: 2 });//加密秘钥由1-128个字符组成，请重新输入!
                return false;
            }

            //检查通讯密码

            if (postdata.ConnectPassword && postdata.ConnectPassword != "") {
                postdata.ConnectPassword = postdata.ConnectPassword.toUpperCase();
                if (postdata.ConnectPassword.length < 4 || postdata.ConnectPassword.length > 8) {
                    layer.alert(getLanguage("LocalService.ConnectPassword_err"), { icon: 2 });//通讯密码由4-8个数字组成，请重新输入！
                    return false;
                }
                if (!CheckIsNumString(postdata.ConnectPassword)) {
                    layer.alert(getLanguage("LocalService.ConnectPassword_err"), { icon: 2 });//通讯密码由4-8个数字组成，请重新输入！
                    return false;
                }
            }

            if (Telnet) {
                postdata.UseTelnet = postdata.UseTelnet == '1' ? 1 : 0;
                postdata.TelnetPort = parseInt(postdata.TelnetPort);
            }


            if (SSH) {
                postdata.UseSSH = postdata.UseSSH == '1' ? 1 : 0;
                postdata.SSHPort = parseInt(postdata.SSHPort);
            }

            if (Telnet || SSH) {
                if (!postdata.SSHLoginPassword || postdata.SSHLoginPassword == '')
                    delete postdata.SSHLoginPassword;
                else
                    if (postdata.SSHLoginPassword.length < 4) {
                        layer.alert(getLanguage("device.SSHLoginPassword_err"), { icon: 2 });//管理密码不能少于4个字符
                        return false;
                    }
            }
            //if (RTSP) {
                postdata.UseRTSP = postdata.UseRTSP == '1' ? 1 : 0;
            //    postdata.RTSPPort = parseInt(postdata.RTSPPort);
            //}


            var ports = [];
            ports.push(postdata.HTTPPort);

            // 检查端口号是否有效，只对有效的端口号进行重复性检查
            if (!isNaN(postdata.HTTPSPort) && postdata.HTTPSPort > 0) {
                var checkRet = checkPortRepetition(ports, postdata.HTTPSPort, getLanguage('device.HTTSPortRepetition'));
                if (!checkRet) return false;
            }

            if (!isNaN(postdata.UDPPort) && postdata.UDPPort > 0) {
                var checkRet = checkPortRepetition(ports, postdata.UDPPort, getLanguage('LocalService.IPV4UDPPortRepetition'));
                if (!checkRet) return false;
            }

            if (!isNaN(postdata.TCPPort) && postdata.TCPPort > 0) {
                var checkRet = checkPortRepetition(ports, postdata.TCPPort, getLanguage('LocalService.IPV4TCPPortRepetition'));
                if (!checkRet) return false;
            }
            if (!isNaN(postdata.TCPSSLPort) && postdata.TCPSSLPort > 0) {
                var checkRet = checkPortRepetition(ports, postdata.TCPSSLPort, getLanguage('LocalService.IPV4SSLPortRepetition'));
                if (!checkRet) return false;
            }

            if (!isNaN(postdata.IPv6_UDPPort) && postdata.IPv6_UDPPort > 0) {
                var checkRet = checkPortRepetition(ports, postdata.IPv6_UDPPort, getLanguage('LocalService.IPV6UDPPortRepetition'));
                if (!checkRet) return false;
            }

            if (!isNaN(postdata.IPv6_TCPPort) && postdata.IPv6_TCPPort > 0) {
                var checkRet = checkPortRepetition(ports, postdata.IPv6_TCPPort, getLanguage('LocalService.IPV6TCPPortRepetition'));
                if (!checkRet) return false;
            }
            if (!isNaN(postdata.IPv6_TCPSSLPort) && postdata.IPv6_TCPSSLPort > 0) {
                var checkRet = checkPortRepetition(ports, postdata.IPv6_TCPSSLPort, getLanguage('LocalService.IPV6SSLPortRepetition'));
                if (!checkRet) return false;
            }


            if (Telnet && !isNaN(postdata.TelnetPort) && postdata.TelnetPort > 0) {
                var checkRet = checkPortRepetition(ports, postdata.TelnetPort, getLanguage('device.TelnetPortRepetition'));
                if (!checkRet) return false;
            }
            if (RTSP && !isNaN(postdata.RTSPPort) && postdata.RTSPPort > 0) {
                var checkRet = checkPortRepetition(ports, postdata.RTSPPort, getLanguage('device.RTSPPortRepetition'));
                if (!checkRet) return false;
            }
            if (SSH && !isNaN(postdata.SSHPort) && postdata.SSHPort > 0) {
                var checkRet = checkPortRepetition(ports, postdata.SSHPort, getLanguage('device.SSHPortRepetition'));
                if (!checkRet) return false;
            }

            layer.confirm(getLanguage('Other.o1'), { icon: 3 }, function (confirmindex, layero, that) {

                //启动遮罩层
                var waitLayerIndex = layer.load(1, { shade: [0.5, '#FFF'] });

                faceAPI.AjaxPOSTJson({
                    data: postdata,
                    url: '/api/device/UpdateParameter',
                    success: function (result) {
                        layer.close(waitLayerIndex);

                        if (result.result == false) {
                            layer.alert(result.error, { icon: 2 });
                        }
                        else {
                            formdata = data.field;
                            layer.alert(getLanguage('DeviceInfo.d23'), { icon: 1 });
                        }
                    }
                });
                layer.close(confirmindex);
                return false;
            });

            return false;
        });
        function checkPortRepetition(ports, newport, errtip) {
            // Check if ports is defined and is an array
            if (!ports || !Array.isArray(ports)) {
                console.error('Ports parameter is not a valid array');
                return false;
            }
            
            // Check if newport is valid
            if (newport === undefined || newport === null || isNaN(newport)) {
                console.error('New port parameter is not valid');
                return false;
            }
            
            var length = ports.length;

            for (var i = 0; i < length; i++) {
                // Check if ports[i] is valid before comparison
                if (ports[i] !== undefined && ports[i] !== null && !isNaN(ports[i]) && ports[i] == newport) {
                    layer.alert(errtip, { icon: 2 });
                    return false;
                }
            }

            ports.push(newport);
            return true;

        }

        $("#data-reset-btn").on('click', function () {
            layer.confirm(getLanguage('Other.o2'), { icon: 3, btn: ["Yes", "No"] }, function (index, layero, that) {
                LoadData();
                layer.close(index)
            });
        });

        faceAPI.ShowMouseTipMessageBox('device_NetworkOption_div_filter', layer);


        faceAPI.CheckInputBox();


        const { SSH, Telnet, RTSP, IPV6, SSL, Packet_Encrypt
        } = faceAPI.DeviceFunctionList

        if (!SSH) {
            faceAPI.removeElement('.FunctionListSSH');
        }
        if (!Telnet) {
            faceAPI.removeElement('.FunctionListTelnet');
        }
        if (!SSH && !Telnet) {
            faceAPI.removeElement('.FunctionListRootPIN');
        }


        if (!RTSP) {
            faceAPI.removeElement('.FunctionListRTSP');
        }
        if (!IPV6) {
            layui.element.tabDelete('device_NetworkServer_tab_filter', 'ipv6');
        }

        if (!SSL) {
            faceAPI.removeElement('.FunctionListSSL');
        }
        if (!Packet_Encrypt) {
            faceAPI.removeElement('.FunctionListPacket_Encrypt');
        }
            
        
    });
</script>
