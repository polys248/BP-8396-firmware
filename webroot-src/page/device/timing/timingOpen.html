<script>
    layui.use(['form', 'faceAPI', 'faceTiming', 'laydate'], function () {
        setLanguage();
        setAllAttrVal();
        var faceAPI = layui.faceAPI;
        var form = layui.form;
        var $ = layui.$;
        var laydate = layui.laydate;

        form.render();

        var timingOpen = layui.faceTiming.CreateTiming($, form);

        var formdata;

        function LoadData() {
            var parameter = {
                "Door": true
            };
            faceAPI.AjaxPOSTJson({
                data: parameter,
                url: '/api/Device/GetDetail',
                success: function (result) {
                    if (result != null && result.result) {

                        formdata = result.content;
                        form.val("device_Update_div_filter", formdata);

                        timingOpen.init("timingOpen_edit_div_filter", "timingOpen", formdata.TimingOpen_timegroup, laydate);


                    };
                }
            });
        }
        LoadData();
        form.on('submit(data-save-btn)', function (data) {
            if (!timingOpen.SaveTimeGroup()) {
                return false;
            }

            layer.confirm(getLanguage("timingOpen.t3"), { icon: 3 }, function (index, layero, that) {

                var postdata = data.field;
                postdata.TimingOpen_timegroup = timingOpen.getWeekDetail();
                
                for (var i = 1; i <= 8; i++) {

                    delete postdata["timingOpen_blockBegin_" + i];
                    delete postdata["timingOpen_blockEnd_" + i];
                }
                postdata.TimingOpen = postdata.TimingOpen == '1' ? 1 : 0;
                postdata.TimingOpen_mode = Number(postdata.TimingOpen_mode);

                //启动遮罩层
                var waitLayerIndex = layer.load(1, { shade: [0.5, '#FFF'] });

                faceAPI.AjaxPOSTJson({
                    data: postdata,
                    url: '/api/device/UpdateParameter',
                    success: function (result) {
                        layer.close(waitLayerIndex);

                        if (result.result == false) {
                            layer.alert(result.error, { icon: 2 });
                        }
                        else {
                            formdata = data.field;

                            layer.alert(getLanguage("timingOpen.t4"), { icon: 1 });
                        }
                    }
                });
                layer.close(index);
            });

        });
        $("#data-reset-btn").on('click', function () {

            layer.confirm(getLanguage("timingOpen.t5"), { icon: 3, btn: ["Yes", "No"] }, function (index, layero, that) {
                LoadData();
                layer.close(index)
            });

        });




    });
</script>
