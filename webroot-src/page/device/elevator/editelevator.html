<script>
    setLanguage();
    setAllAttrVal()
    layui.use(['form', 'upload', 'faceAPI', 'faceTiming', 'laydate'], function () {
        var form = layui.form,
            layer = layui.layer,
            $ = layui.$;
        var faceAPI = layui.faceAPI;
        var bIniOver = false;
        var iCurrentWeekid = 0;
        var laydate = layui.laydate;
        // 当前弹出层，防止ID被覆盖
        var parentIndex = layer.index;
        
        var timingOpenPanel = layui.faceTiming.CreateTiming($, form);

        /**
         * 初始化表单，要加上，不然刷新部分组件可能会不加载
         */
        form.render();
        faceAPI.ElevatorTimeGroupEditResult = {
            result: false
        };


        var timingOpen = faceAPI.TimeGroupEditPage.TimingOpen;

        faceAPI.TimeGroupEditPage.TimingOpen_Use = timingOpen.Use;

        form.val("device_Elevator_Edit_div_filter", faceAPI.TimeGroupEditPage);

        timingOpenPanel.init("timingOpen_edit_div_filter", "timingOpen", timingOpen.Timegroup, laydate);





        form.on('submit(data_Elevator_Edit_Save_btn)', function (data) {
            if (!timingOpenPanel.SaveTimeGroup()) {
                return false;
            }

            var postdata = data.field;
            postdata.Timegroup = timingOpenPanel.getWeekDetail();

            postdata.RelayType = parseInt(postdata.RelayType);
            postdata.ReleaseTime = parseInt(postdata.ReleaseTime);
            postdata.TimingOpen_Use = postdata.TimingOpen_Use == '1' ? 1 : 0;
            postdata.TimingOpen_Open = 3;


            faceAPI.ElevatorTimeGroupEditResult.result = true;
            faceAPI.ElevatorTimeGroupEditResult = { ...faceAPI.ElevatorTimeGroupEditResult, ...postdata };

            layer.close(parentIndex);
            return false;
        });

        form.on('submit(data_Elevator_Edit_Close_btn)', function (data) {

            faceAPI.ElevatorTimeGroupEditResult.result = false;

            layer.close(parentIndex);
            return false;
        });
        bIniOver = true;

        faceAPI.CheckInputBox();
    });
</script>
