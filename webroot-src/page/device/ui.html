<script>



    layui.use(['form', 'element', 'faceAPI'], function () {
        setLanguage();
        setAllAttrVal();
        var faceAPI = layui.faceAPI;
        var form = layui.form;
        var $ = layui.$;

        var formdata;

        function LoadData() {
            var parameter = {
                "UI": true,
                "Language": true
            };
            faceAPI.AjaxPOSTJson({
                data: parameter,
                url: '/api/Device/GetDetail',
                success: function (result) {
                    if (result != null && result.result) {

                        formdata = result.content;

                        formdata.SystemTime = faceAPI.unixTimeStampToDateString(formdata.SystemTime);
                        form.val("device_UI_div_filter", formdata);
                    };
                }
            });

        }

            menu_timezone[33] = "UTC+12:00";   //"Pacific/Tarawa";          基里巴斯-塔拉瓦、拜里基、马金
            menu_timezone[34] = "UTC+12:45";   //"Pacific/Chatham";         新西兰-查塔姆群岛、惠灵顿、奥克兰
            menu_timezone[35] = "UTC+13:00";   //"Pacific/Apia";            萨摩亚
            menu_timezone[36] = "UTC+14:00";   //"Pacific/Kiritimati";      基里巴斯-圣诞岛、塔拉瓦、马金
            //<select name="TimeZone" required lay-verify="">

            //给Select填充元素
            // 查询名称为 TimeZone 的 select 标签
            const $select = $('select[name="UTCTimeZone"]');
            for (var i = 0; i <= 36; i++) {
                var sTime = menu_timezone[i];
                const newOption = `<option value="${sTime}">${sTime}</option>`;
                // 将新的 option 元素添加到 select 标签中
                $select.append(newOption);
            }

        }

        IniUTCTimeZoneList();
        LoadData();
        form.render();
       


        form.on('submit(data-save-btn)', function (data) {

            layer.confirm(getLanguage("device.ui_SaveTips"), { icon: 3 }, function (index, layero, that) {
                var postdata = data.field;

                postdata.DisplayBrightness = Number(postdata.DisplayBrightness);

                postdata.ShowIR = postdata.ShowIR == "1" ? 1 : 0;
                postdata.UseQRCode = postdata.UseQRCode == "1" ? 1 : 0;
                postdata.UseComplexUserID = postdata.UseComplexUserID == "1" ? 1 : 0;

                postdata.UseFastRecognition = postdata.UseFastRecognition == "1" ? 1 : 0;
                postdata.UseRequestAuthorization = postdata.UseRequestAuthorization == "1" ? 1 : 0;
                
                //postdata.UseFingerprint = postdata.UseFingerprint == "1" ? 1 : 0;
                //postdata.UsePalmvein = postdata.UsePalmvein == "1" ? 1 : 0;
                //postdata.UseUDPNetwork = postdata.UseUDPNetwork == "1" ? 1 : 0;
                //postdata.UseHTTPClient = postdata.UseHTTPClient == "1" ? 1 : 0;
                

                postdata.FillLight = Number(postdata.FillLight);




                postdata.ShowPersonPhoto = postdata.ShowPersonPhoto == "1" ? 1 : 0;
                postdata.PlayPersonName = postdata.PlayPersonName == "1" ? 1 : 0;
                postdata.RecognitionButton = postdata.RecognitionButton == "1" ? 1 : 0;
                postdata.UnregisteredWarn = postdata.UnregisteredWarn == "1" ? 1 : 0;
                postdata.ShowPersonName = postdata.ShowPersonName == "1" ? 1 : 0;
                postdata.StrongCipher = postdata.StrongCipher == "1" ? 1 : 0;



                postdata.Language = Number(postdata.Language);
                postdata.UseNTP = postdata.UseNTP == "1" ? 1 : 0;
                postdata.TimeZone = Number(postdata.TimeZone);
                postdata.Voice = postdata.Voice == "1" ? 1 : 0;
                postdata.Volume = Number(postdata.Volume);

                postdata.UseFingerprint = postdata.UseFingerprint == "1" ? 1 : 0;
                postdata.UsePalmvein = postdata.UsePalmvein == "1" ? 1 : 0;

                layer.close(index)
                
                var pwdlen = postdata.MenuPassword.length;
                if (postdata.StrongCipher == 1) {
                    if (pwdlen == 0) {
                        layer.alert(getLanguage("device.password_check_err1"), { icon: 2 });//管理密码不能为空
                        return;
                    }
                    if (pwdlen < 6) {
                        layer.alert(getLanguage("device.password_check_err2"), { icon: 2 });//管理密码不能少于6个字符
                        return;
                    }
                }
                else {
                    if (pwdlen > 0 && pwdlen < 4) {
                        layer.alert(getLanguage("device.password_check_err3"), { icon: 2 });//管理密码不能少于4个字符
                        return;
                    }
                }


                delete postdata["SystemTime"];
                //启动遮罩层
                var waitLayerIndex = layer.load(1, { shade: [0.5, '#FFF'] });
                faceAPI.AjaxPOSTJson({
                    data: postdata,
                    url: '/api/device/UpdateParameter',
                    success: function (result) {
                        layer.close(waitLayerIndex)

                        if (result.result == false) {

                            if (result.error == "parameter error: MenuPassword is empty!") {
                                layer.alert(getLanguage("device.password_check_err1"), { icon: 2 });//管理密码不能为空
                                return;
                            }
                            if (result.error == "parameter error: MenuPassword the length must be greater than 6!") {
                                layer.alert(getLanguage("device.password_check_err2"), { icon: 2 });//管理密码不能为空
                                return;
                            }
                            if (result.error == "parameter error: MenuPassword the length must be greater than 4!") {
                                layer.alert(getLanguage("device.password_check_err3"), { icon: 2 });//管理密码不能少于4个字符
                                return;
                            }
                            if (result.error == "parameter error: MenuPassword too simple!") {
                                layer.alert(getLanguage("device.password_check_err4"), { icon: 2 });//管理密码太简单，需要大写字母+小写字母+数字+特殊符号组合！
                                return;
                            }

                            layer.alert(result.error, { icon: 2 });
                        }
                        else {
                            formdata = data.field;
                            layer.alert(getLanguage("Facerecognition.f4"), { icon: 1 });
                        }
                    }
                });

            });

        });
        $("#data-reset-btn").on('click', function () {
            layer.confirm(getLanguage("device.ui_ReloadTips"), { icon: 3, btn: ["Yes", "No"] }, function (index, layero, that) {
                LoadData();
                layer.close(index)
            });
        });

        form.on('submit(btn-SyncTime)', function (data) {

            var parameter = {
                "Language": true
            };

            faceAPI.AjaxPOSTJson({
                url: '/api/Device/GetDetail',
                data: parameter,
                success: function (rst) {
                    if (rst != null && rst.result) {

                        formdata.SystemTime = faceAPI.unixTimeStampToDateString(rst.content.SystemTime);

                        var _page = $('#device_UI_div');

                        _page.find('input[name=SystemTime]').each((ind, em) => {
                            var _em = $(em);
                            _em.val(formdata.SystemTime);
                        });
                        form.val("device_info_div_filter", formdata);
                    };
                }
            });
        });

        form.on('submit(btn-WriteTime)', function (data) {

            layer.confirm(getLanguage("device.ui_WriteTimeTips"), { icon: 3 }, function (index, layero, that) {
                // 创建一个Date对象，表示当前时间
                const now = new Date();

                // 使用getTime()方法获取毫秒级的时间戳
                const unixTimestamp = now.getTime();

                // 如果您需要秒级的时间戳，可以将毫秒时间戳除以1000，并使用Math.floor()函数取整
                const unixTimestampInSeconds = Math.floor(unixTimestamp / 1000);

                var postdata = {
                    "SystemTime": unixTimestampInSeconds
                };

                faceAPI.AjaxPOSTJson({
                    data: postdata,
                    url: '/api/device/UpdateParameter',
                    success: function (result) {
                        if (result.result == false) {
                            layer.alert(result.error, { icon: 2 });
                        }
                        else {
                            formdata = data.field;
                            layer.alert(getLanguage("device.ui_WriteTimeOverTips"), { icon: 1 });
                        }
                    }
                });
                layer.close(index)
            });
        });

        faceAPI.ShowMouseTipMessageBox("device_UI_div_filter", layer);
        faceAPI.CheckInputBox();

        if (faceAPI?.DeviceFunctionList) {
            const { Face, QRCode, RecognitionButton, FastRecognition, RequestAuthorization,
                LCD, FillLight, TTS, Voice, ComplexUserID, SuccessRecognitionWelcomeSpeech,
                StrongCipher, Fingerprint, Palmvein,
                PlayPersonName
            } = faceAPI.DeviceFunctionList;
            console.log('[ faceAPI.DeviceFunctionList ] >', faceAPI.DeviceFunctionList)


            if (!QRCode) {
                faceAPI.removeElement('.FunctionListQRCode');
            }
            if (!Face) {
                faceAPI.removeElement('.FunctionListFace');
            }
            if (!RecognitionButton) {
                faceAPI.removeElement('.FunctionList_RecognitionButton');
            }
            if (!FastRecognition) {
                faceAPI.removeElement('.FunctionList_FastRecognition');
            }
            if (!RequestAuthorization) {
                faceAPI.removeElement('.FunctionList_RequestAuthorization');
            }
            if (!RecognitionButton && !FastRecognition) {
                faceAPI.removeElement('.FunctionList_RecognitionButton_FastRecognition');
            }
            if (!LCD ) {
                faceAPI.removeElement('.FunctionList_LCD');
            }
            if (!FillLight) {
                faceAPI.removeElement('.FunctionList_FillLight');
            }
            if (!TTS) {
                faceAPI.removeElement('.FunctionList_TTS');
            }
            if (!Voice) {
                faceAPI.removeElement('.FunctionList_Voice');
            }
            if (!Face && !QRCode) {
                faceAPI.removeElement('.FunctionList_Face_QRCode');
            }
            if (!ComplexUserID) {
                faceAPI.removeElement('.FunctionListComplexUserID');
            }

            if (!SuccessRecognitionWelcomeSpeech)
            {
                faceAPI.removeElement('.FunctionListSuccessRecognitionWelcomeSpeech');
            }
            if (!RequestAuthorization && !SuccessRecognitionWelcomeSpeech) {
                faceAPI.removeElement('.FunctionList_RequestAuthorization_WelcomeSpeech');
            }
            if (!StrongCipher) {
                faceAPI.removeElement('.FunctionListStrongCipher');
            }


            if (!Fingerprint) {
                faceAPI.removeElement('.FunctionList_FP');
            }
            if (!Palmvein) {
                faceAPI.removeElement('.FunctionList_Palmvein');
            }

            if (!Fingerprint && !Palmvein) {
                faceAPI.removeElement('.FunctionList_FP_Palmvein');
            }

            if (!PlayPersonName) {
                faceAPI.removeElement('.FunctionList_PlayPersonName');
            }

            


        }


    });
</script>
