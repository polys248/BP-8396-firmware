<script>
    layui.use(['form', 'element', 'faceAPI'], function () {
        setLanguage();
        setAllAttrVal();
        var faceAPI = layui.faceAPI;
        var form = layui.form;
        var $ = layui.$;
      
        var formdata;
        function LoadData() {
            var parameter = {
                "Face": true,
                "BodyTemperature": true,
            };
            faceAPI.AjaxPOSTJson({
                data: parameter,
                url: '/api/Device/GetDetail',
                success: function (result) {
                    if (result != null && result.result) {

                        formdata = result.content;
                        form.val("device_Face_div_filter", formdata);
                    };
                }
            });

        }
        LoadData();
        form.on('submit(data-save-btn)', function (data) {

            layer.confirm(getLanguage("Facerecognition.f3"), { icon: 3 }, function (index, layero, that) {
                var postdata = data.field;

                postdata.FaceIR = postdata.FaceIR == "1" ? 1 : 0;
                postdata.FaceIRThreshold = Number(postdata.FaceIRThreshold);

                postdata.FaceDistance = Number(postdata.FaceDistance);

                postdata.FPComparison = Number(postdata.FPComparison);
                postdata.FaceThreshold = Number(postdata.FaceThreshold);
                
                
                postdata.FaceMask = postdata.FaceMask == "1" ? 1 : 0;
                postdata.FaceMaskThreshold = Number(postdata.FaceMaskThreshold);

                postdata.UseBodyTemperature = postdata.UseBodyTemperature == "1" ? 1 : 0;
                postdata.UseFahrenheitDisplay = postdata.UseFahrenheitDisplay == "1" ? 1 : 0;
                postdata.TemperatureDisplay = postdata.TemperatureDisplay == "1" ? 1 : 0;
                
                // 检查体温检测功能是否开启，开启时才需要温度补偿值和报警阈值
                if(postdata.UseBodyTemperature == 1) {
                    postdata.TemperatureCompensate = Number(postdata.TemperatureCompensate);
                    postdata.TemperatureAlarmThreshold = Number(postdata.TemperatureAlarmThreshold);
                } else {
                    // 体温检测关闭时，设置默认值以避免验证错误
                    postdata.TemperatureCompensate = 0;
                    postdata.TemperatureAlarmThreshold = 37.5;
                }

                //启动遮罩层
                var waitLayerIndex = layer.load(1, { shade: [0.5, '#FFF'] });

                faceAPI.AjaxPOSTJson({
                    data: postdata,
                    url: '/api/device/UpdateParameter',
                    success: function (result) {
                        layer.close(waitLayerIndex);

                        if (result.result == false) {
                            layer.alert(result.error, { icon: 2 });
                        }
                        else {
                            formdata = data.field;
                            layer.alert(getLanguage("Facerecognition.f4"), { icon: 1 });
                        }
                    }
                });
                layer.close(index);
            });

        });
        $("#data-reset-btn").on('click', function () {
            layer.confirm(getLanguage("Facerecognition.f5"), { icon: 3 ,btn:["Yes","No"]}, function (index, layero, that) {
                LoadData();
                layer.close(index)
            });
        });

        faceAPI.ShowMouseTipMessageBox("device_Face_div_filter", layer);
        faceAPI.CheckInputBox();




        if(faceAPI?.DeviceFunctionList){
            // faceAPI.DeviceFunctionList.BodyTemperature=false;
            const {Face,FaceMask,SafetyHelmet,Fingerprint,BodyTemperature}=faceAPI.DeviceFunctionList
            console.log('[ faceAPI.DeviceFunctionList ] >', faceAPI.DeviceFunctionList)
            

            if(!Fingerprint){
                faceAPI.removeElement('.FunctionListFingerprint');
            }
            if(!Face){
                faceAPI.removeElement('.FunctionListFace');
            }

            

            if(!FaceMask){
                faceAPI.removeElement('.FunctionListFaceMask');
            }
            if(!BodyTemperature){
                faceAPI.removeElement('.FunctionListBodyTemperature');
            }

            

        }
    });
</script>
