            var postData = {};
            postData[command] = true;
            faceAPI.AjaxPOSTJson({
                url: '/api/Device/Remote',
                data: postData,
                success: function (rst) {
                    layer.close(index);

                    // debugger;
                    if (rst != null && rst.result) {
                        layer.alert(getLanguage('Remote.r12'), { icon: 1 });

                    }
                    else {
                        layer.alert(getLanguage('Remote.r13'), { icon: 2 });
                    };

                }
            });

        });


        $('[name="command_system"]').on('click', function () {
            var command = $(this).attr('data-command');
            var postData = {};
            postData[command] = true;

            layer.confirm(getLanguage("Remote.RemoteTip"), { icon: 3, btn: ["Yes", "No"] }, function (index, layero, that) {


                layer.close(index);

                var content = miniPage.getHrefContent(
                    "page/user/CheckPassword.html"
                );
                faceAPI.CheckPasswordResult = false;
                
                // debugger;
                layer.open({
                    title: getLanguage("user.checkPassword"),
                    type: 1,
                    shade: 0.4,
                    area: ["500px", "200px"],

                    content: content,
                    end: function (e) {
                        if (faceAPI.CheckPasswordResult) {
                            SendSystemCommand(postData, command);
                        }
                    },
                });

            });

            return false;

        });

        function SendSystemCommand(postData, command) {
            //启动遮罩层
            var waitLayerIndex = layer.load(1, { shade: [0.5, '#FFF'] });
            
            faceAPI.AjaxPOSTJson({
                url: '/api/Device/Remote',
                data: postData,
                success: function (rst) {
                    if (command == "Restart") {
                        setTimeout(function () {
                            layer.close(waitLayerIndex);
                        }, 25 * 1000)
                    }
                    else {
                        layer.close(waitLayerIndex);
                        // debugger;
                        if (rst != null && rst.result) {
                            layer.alert(getLanguage('Remote.r12'), { icon: 1 });

                        }
                        else {
                            layer.alert(getLanguage('Remote.r13'), { icon: 2 });
                        };
                    }
                    

                }
            });
        }
    });
</script>
