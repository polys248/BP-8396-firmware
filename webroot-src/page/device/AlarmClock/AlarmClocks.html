<div class="layuimini-container layuimini-page-anim" divname="admin">
    <div class="layuimini-main">



        <table class="layui-hide" id="AlarmClockTable" lay-filter="AlarmClockTableFilter"></table>

        <script type="text/html" id="currentTableBar">
            <a class="layui-btn layui-btn-normal layui-btn-xs data-count-edit" lay-event="edit">
                <span language="people.p7">编辑</span>
            </a>
        </script>

    </div>
</div>

<script>
    layui.use(['table', 'miniPage', 'faceAPI'], function () {
        var $ = layui.jquery,
            table = layui.table,
            miniPage = layui.miniPage;
        var faceAPI = layui.faceAPI;
        var openWH = miniPage.getOpenWidthHeight();
        var tableId = "AlarmClockTable";
        table.render({
            elem: '#AlarmClockTable',
            data: [],
            limit: 1000,
            height: openWH[1] - 60,
            skin: 'line',
            cols: [[
                
                { field: 'Num', width: 140, title: getLanguage("AlarmClocks.AlarmClocks_Num"), sort: true },
                { field: 'Clock', title: getLanguage("AlarmClocks.AlarmClocks_Clock"), sort: true },
                { field: 'Times', title: getLanguage("AlarmClocks.AlarmClocks_Times"), sort: true },
                { fixed: 'right', title: getLanguage('people.p18'), toolbar: '#currentTableBar', width: 180 }]]
        });

        var dbAlarmClocks = [];
        function LoadData() {
            var parameter = {
                "AlarmClocks": true
            };
            faceAPI.AjaxPOSTJson({
                data: parameter,
                url: '/api/Device/GetDetail',
                success: function (rst) {
                    var formdata = [];
                    if (rst != null && rst.result) {
                        formdata = rst.content.AlarmClocks;
                    }
                    dbAlarmClocks = formdata;
                    LoadTable(formdata);

                }
            });

        }

        function LoadTable(data) {
            table.reload(tableId, {
                data: data
            });
        }

        LoadData();


        /**
        *数据行点击事件
        */
        table.on('tool(AlarmClockTableFilter)', function (obj) {
            if (obj.event == "edit") {
                editAlarmClock(obj.data);

            }
        });

        function editAlarmClock(data) {
            var content = miniPage.getHrefContent('page/device/AlarmClock/AlarmClockEdit.html');

            faceAPI.AlarmClock = data;//向layer页面传值，传值主要代码
            var index = layer.open({
                title: getLanguage("AlarmClocks.AlarmClocks_Edit"),
                type: 1,
                shade: 0.2,
                maxmin: false,
                shadeClose: false,
                area: ['400px', '350px'],
                content: content,
                end: function (layero, index) {

                    if (faceAPI.AlarmClockResult == true) {
                        data = faceAPI.AlarmClock


                        for (var i = 0; i < dbAlarmClocks.length; i++) {
                            if (dbAlarmClocks[i].Num == data.Num) {

                                dbAlarmClocks[i] = { ...dbAlarmClocks[i], ...data };
                                break;
                            }
                        }

                        //开始提交
                        //启动遮罩层
                        var waitLayerIndex = layer.load(1, { shade: [0.5, '#FFF'] });
                        var postdata = {
                            AlarmClocks: dbAlarmClocks
                        };

                        faceAPI.AjaxPOSTJson({
                            data: postdata,
                            url: '/api/device/UpdateParameter',
                            success: function (result) {
                                layer.close(waitLayerIndexwaitLayerIndex)

                                if (result.result == false) {
                                    layer.alert(result.error, { icon: 2 });
                                }
                                else {
                                    layer.alert(getLanguage('timingLock.t4'), { icon: 1 });

                                    LoadTable(dbAlarmClocks);

                                }
                                
                            }
                        });

                    }
                }
            });
        }

    });
    setTimeout(() => {
        setLanguage();
        setAllAttrVal()
    }, 100);
</script>
