<script>
    
    layui.use(['form', 'laydate', 'table', 'miniPage', 'element', 'faceAPI'], function () {
        setLanguage();
        setAllAttrVal();
        var faceAPI = layui.faceAPI;
        var form = layui.form;
        var $ = layui.$;
        form.render();
        load();
        $("#btn_GetStatus").on('click', function () {
            console.log('[ 123 ] >', 123)
            load();
        });

        $("#btn_CloseAlarm").on('click', function () {
            var index = layer.load(2);

            var parameter = {
                "CloseAlarm": true
            };

            faceAPI.AjaxPOSTJson({
                url: '/api/Device/Remote',
                data: parameter,
                success: function (rst) {
                    layer.close(index);

                    // debugger;
                    if (rst != null && rst.result) {
                        layer.alert(getLanguage("DeviceStatus.CloseAlarmOverTip"), { icon: 1 });
                        load();

                    }
                    else {
                        layer.alert(getLanguage("DeviceStatus.CloseAlarmErrTip"), { icon: 2 });
                    };

                }
            });
        });

        function load() {
            var index = layer.load(2);
            var parameter = {
                "Status": true,
                "Storage": true
            };
            faceAPI.AjaxPOSTJson({
                url: '/api/Device/GetDetail',
                data: parameter,
                success: function (rst) {
                    // debugger;
                    if (rst != null && rst.result) {
                        var device = rst.content;
                        device.DoorSensorStatus = device.DoorSensorStatus ? 1 : 0;
                        device.RelayStatus = device.RelayStatus ? 1 : 0;
                        device.KeepOpenStatus = device.KeepOpenStatus ? 1 : 0;
                        device.LockDoorStatus = device.LockDoorStatus ? 1 : 0;

                        if (device.PeopleStorageInfo !== undefined) {
                            var PeopleStorageInfo = device.PeopleStorageInfo;
                            device.Person = capacityToString(PeopleStorageInfo.Person);
                            device.Face = capacityToString(PeopleStorageInfo.Face);
                            device.Card = capacityToString(PeopleStorageInfo.Card);
                            device.Fingerprint = capacityToString(PeopleStorageInfo.Fingerprint);
                            device.PalmVein = capacityToString(PeopleStorageInfo.PalmVein);
                            device.Pasword = capacityToString(PeopleStorageInfo.Pasword);
                            device.Admin = capacityToString(PeopleStorageInfo.Admin);
                        }
                        if (device.RecordStorageInfo !== undefined) {
                            var RecordStorageInfo = device.RecordStorageInfo;
                            device.VerifyRecord = capacityToString(RecordStorageInfo.VerifyRecord);
                            device.DoorRecord = capacityToString(RecordStorageInfo.DoorRecord);
                            device.SystemRecord = capacityToString(RecordStorageInfo.SystemRecord);
                            device.RecordPhoto = capacityToString(RecordStorageInfo.RecordPhoto);
                        }

                        device.BootTime = faceAPI.unixTimeStampToDateString(device.BootTime)


                        var alarmTitleMap = {};
                        alarmTitleMap["fire"] = getLanguage('device.d234');//"消防报警";
                        alarmTitleMap["blacklist"] = getLanguage('device.d237');//"黑名单报警";
                        alarmTitleMap["anti"] = getLanguage('DeviceStatus.d28');//"防拆报警";
                        alarmTitleMap["illegal"] = getLanguage('device.d377');//"非法验证";
                        alarmTitleMap["password"] = getLanguage('device.d382');//"胁迫报警密码";
                        alarmTitleMap["openTimeout"] = getLanguage('device.d236');//"开门超时报警";
                        alarmTitleMap["doorSensor"] = getLanguage('device.d235');//"门磁报警";
                        alarmTitleMap["null"] = getLanguage('device.d233');//"无报警";


                        if (device.hasOwnProperty("AlarmStatus") == true) {
                            var alarm = device.AlarmStatus;
                            if (alarm.length > 0) {
                                let alarms = alarm.split(",");
                                let alarmCount = alarms.length;
                                let alarmStr = [];
                                for (var i = 0; i < alarmCount; i++) {
                                    if (alarmTitleMap.hasOwnProperty(alarms[i]))
                                        alarmStr.push(alarmTitleMap[alarms[i]]);
                                }
                                device.AlarmStatus = alarmStr.join(",");
                            }
                            else {
                                device.AlarmStatus = alarmTitleMap["null"];
                            }
                        }
                        else {
                            device.AlarmStatus = alarmTitleMap["null"];
                        }




                        form.val("device_status_div_filter", device);
                    };
                    layer.close(index);
                }
            });
        }

        function capacityToString(obj) {
            return obj.Current + "/" + obj.Max;
        }

        if(faceAPI?.DeviceFunctionList){
            // faceAPI.DeviceFunctionList.BodyTemperature=false;
            const {Face,Fingerprint,Palmvein}=faceAPI.DeviceFunctionList
            console.log('[ faceAPI.DeviceFunctionList ] >', faceAPI.DeviceFunctionList)
            

            if(!Fingerprint){
                faceAPI.removeElement('.FunctionListFingerprint');
            }
            if(!Face){
                faceAPI.removeElement('.FunctionListFace');
            }

            

            if(!Palmvein){
                faceAPI.removeElement('.FunctionListPalmvein');
            }
            // if(!BodyTemperature){
            //     faceAPI.removeElement('.FunctionListBodyTemperature');
            // }

            

        }

    });


    
</script>
