<script>
    layui.use(['form', 'laydate', 'table', 'miniPage', 'element', 'faceAPI', 'faceTiming'], function () {
        setLanguage();
        setAllAttrVal();
        var faceAPI = layui.faceAPI;
        var form = layui.form;
        var $ = layui.$;
        var laydate = layui.laydate;
        var alarmTimegroup = layui.faceTiming.CreateTiming($, form);
        var formdata;
        function LoadData() {
            var parameter = {
                "Alarm": true,
            };
            faceAPI.AjaxPOSTJson({
                data: parameter,
                url: '/api/Device/GetDetail',
                success: function (rst) {
                    if (rst != null && rst.result) {
                        formdata = rst.content;
                        form.val("device_Alarm_DoorSensor_div_filter", formdata);

                        alarmTimegroup.init("alarmTimegroup_edit_div_filter", "alarmTimegroup", formdata.DoorSensorAlarmTimegroup, laydate);
                    };
                }
            });
        }
        LoadData();

        form.on('submit(data-save-btn)', function (data) {
            if (!alarmTimegroup.SaveTimeGroup()) {
                return false;
            }
            layer.confirm(getLanguage('Alarm.a4'), { icon: 3 }, function (index, layero, that) {

                var postdata = data.field;
                postdata.DoorSensorAlarmTimegroup = alarmTimegroup.getWeekDetail();
                for (var i = 1; i <= 8; i++) {
                    delete postdata["alarmTimegroup_blockBegin_" + i];
                    delete postdata["alarmTimegroup_blockEnd_" + i];
                }

                postdata.DoorSensorAlarm = postdata.DoorSensorAlarm == '1' ? 1 : 0;

                //启动遮罩层
                var waitLayerIndex = layer.load(1, { shade: [0.5, '#FFF'] });

                faceAPI.AjaxPOSTJson({
                    data: postdata,
                    url: '/api/device/UpdateParameter',
                    success: function (result) {
                        layer.close(waitLayerIndex);

                        if (result.result == false) {
                            layer.alert(result.error, { icon: 2 });
                        }
                        else {
                            formdata = data.field;
                            layer.alert(getLanguage('timingLock.t4'), { icon: 1 });
                        }
                    }
                });
                layer.close(index);
            });

        });
        $("#data-reset-btn").on('click', function () {
            layer.confirm(getLanguage('Alarm.a5'), { icon: 3, }, function (index, layero, that) {
                LoadData();
                layer.close(index)
            });

        });
    });
</script>
