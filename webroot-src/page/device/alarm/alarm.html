<script>
    layui.use(['form', 'laydate', 'table', 'miniPage', 'element', 'faceAPI'], function () {
        setLanguage();
        setAllAttrVal();
        var faceAPI = layui.faceAPI;
        var form = layui.form;
        var $ = layui.$;
        var laydate = layui.laydate;

        var formdata;
        function LoadData() {
            var parameter = {
                "Alarm": true,
            };
            faceAPI.AjaxPOSTJson({
                data: parameter,
                url: '/api/Device/GetDetail',
                success: function (rst) {
                    if (rst != null && rst.result) {
                        formdata = rst.content;
                        form.val("device_Alarm_div_filter", formdata);


                    };
                }
            });

        }
        LoadData();

        form.on('submit(data-save-btn)', function (data) {

            layer.confirm(getLanguage('Alarm.a1'), { icon: 3 }, function (index, layero, that) {

                var postdata = data.field;

                postdata.FireAlarm = postdata.FireAlarm == '1' ? 1 : 0;

                postdata.BlacklistAlarm = postdata.BlacklistAlarm == '1' ? 1 : 0;

                postdata.AntiDisassemblyAlarm = postdata.AntiDisassemblyAlarm == '1' ? 1 : 0;

                postdata.UseUserCloseAlarm = postdata.UseUserCloseAlarm == '1' ? 1 : 0;


                postdata.DoorLongOpenAlarm = postdata.DoorLongOpenAlarm == '1' ? 1 : 0;
                postdata.DoorLongOpenTime = parseInt(postdata.DoorLongOpenTime);

                postdata.IllegalVerificationAlarm = postdata.IllegalVerificationAlarm == '1' ? 1 : 0;
                postdata.IllegalVerificationAlarmLimit = parseInt(postdata.IllegalVerificationAlarmLimit);

                postdata.PasswordAlarm = postdata.PasswordAlarm == '1' ? 1 : 0;
                postdata.PasswordAlarm_Mode = parseInt(postdata.PasswordAlarm_Mode);

                //启动遮罩层
                var waitLayerIndex = layer.load(1, { shade: [0.5, '#FFF'] });
                faceAPI.AjaxPOSTJson({
                    data: postdata,
                    url: '/api/device/UpdateParameter',
                    success: function (result) {
                        layer.close(waitLayerIndex);

                        if (result.result == false) {
                            layer.alert(result.error, { icon: 2 });
                        }
                        else {
                            formdata = data.field;
                            layer.alert(getLanguage('timingLock.t4'), { icon: 1 });
                        }
                    }
                });
                layer.close(index);
            });

        });
        $("#data-reset-btn").on('click', function () {
            layer.confirm(getLanguage('Alarm.a2'), { icon: 3 ,btn:["Yes","No"]}, function (index, layero, that) {
                LoadData();
                layer.close(index)
            });

        });

        faceAPI.CheckInputBox();

        {
            var Password = false;//支持密码
            if (faceAPI?.DeviceFunctionList) {
                // faceAPI.DeviceFunctionList.BodyTemperature=false;
                Password = faceAPI?.DeviceFunctionList.Password;

            }


            if (!Password) {
                faceAPI.removeElement('.FunctionList_Password');
            }
        }
    });
</script>
