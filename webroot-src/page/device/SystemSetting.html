<style>
    #SystemSetting_div label {
        width: 250px;
    }

    .layui-form-pane .layui-input-block {
        margin-left: 250px;
        left: -1px;
    }

    .divwidth {
        width: 1850px;
    }

    .status-black {
        margin-left: 10px
    }

    .divpadding {
        padding-right: 20px
    }

    .aligncenter {
        display: flex;
        justify-content: center;
        align-items: center;
    }
</style>
<div class="layui-form layuimini-form  layui-form-pane" id="SystemSetting_div" lay-filter="SystemSetting_div_filter">
    <div class="layui-bg-gray" style="padding: 10px;">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-header" language='DeviceInfo.d1'>设备身份</div>
                    <div class="layui-card-body">
                        <div class="layui-form-item">
                            <label class="layui-form-label"> SN</label>
                            <div class="layui-input-block">
                                <div class="layui-form-mid status-black" name="DeviceSN" autoset></div>
                            </div>

                        </div>

                        <div class="layui-form-item">
                            <label class="layui-form-label" language='DeviceInfo.d25'> 设备名称</label>
                            <div class="layui-input-block">
                                <input type="text" maxlength="30" placeholder=""
                                       name="DeviceName" autocomplete="off" class="layui-input">
                            </div>
                        </div>


                        <div class="layui-form-item ">

                            <label class="layui-form-label" language='DeviceInfo.d11'> 制造商</label>
                            <div class="layui-input-block">
                                <div class="layui-form-mid status-black" name="Manufacturer" autoset></div>
                            </div>
                        </div>

                        <!-- <div class="layui-form-item ">
                            <label class="layui-form-label" language='DeviceInfo.d15'> 厂家电话</label>
                            <div class="layui-input-block">
                                <div class="layui-form-mid status-black" name="ManufacturerPhone" autoset></div>
                            </div>
                        </div> -->
                        <div class="layui-form-item ">

                            <label class="layui-form-label" language='DeviceInfo.d13'> 网址</label>
                            <div class="layui-input-block">
                                <div class="layui-form-mid status-black" name="Website" autoset></div>
                            </div>

                        </div>

                        <div class="layui-form-item ">
                            <div class="layui-inline">
                                <label class="layui-form-label" language='DeviceInfo.d3'> 生产日期</label>
                                <div class="layui-input-block">
                                    <div class="layui-form-mid status-black" name="ProductionDate" autoset></div>
                                </div>
                            </div>

                        </div>

                        <div class="layui-form-item ">
                            <label class="layui-form-label" language='DeviceInfo.d26'> 描述信息</label>
                            <div class="layui-input-block">
                                <input type="text" maxlength="200" placeholder=""
                                       name="OEMText" class="layui-input">
                            </div>

                        </div>
                    </div>

                </div>
            </div>
        </div>

        <div class="layui-card">
            <div class="layui-card-header" language='DeviceInfo.d27'>设备身份</div>
            <div class="layui-card-body">
                <div class="layui-form-item ">
                    <div class="layui-inline">
                        <label class="layui-form-label" language='DeviceInfo.d34'> 设备自动重启</label>
                        <div class="layui-input-inline">
                            <input type="checkbox" name="AutoRestart" lay-skin="switch"
                                   id="device.d189" data-lang="lay-text" lay-text="启用|禁用" unchecked value="1">
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label" language='DeviceInfo.d28'> 时间</label>
                        <div class="layui-input-inline">
                            <input type="text" maxlength="5" lay-verify="required" placeholder="" TimeFormat_HHmm
                                   name="AutoRestartTime" class="layui-input">
                        </div>
                    </div>
                </div>
            </div>
        </div>


        <div class="layui-card">
            <div class="layui-card-header" language='DeviceInfo.d29'>数据存储</div>
            <div class="layui-card-body">
                <div class="layui-form-item ">
                    <!-- <div class="layui-inline">
                        <label class="layui-form-label" language='DeviceInfo.d30'> 记录循环存储</label>
                        <div class="layui-input-inline">
                            <input type="checkbox" name="RecordAutoCycle" lay-skin="switch"
                                   id="device.d189" data-lang="lay-text" lay-text="启用|禁用" unchecked value="1">
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label" language='DeviceInfo.d31'> 保存未注册识别记录</label>
                        <div class="layui-input-inline">
                            <input type="checkbox" name="SaveUnregistered" lay-skin="switch"
                                   id="device.d189" data-lang="lay-text" lay-text="启用|禁用" unchecked value="1">
                        </div>
                    </div> -->
                    <div class="layui-inline">
                        <label class="layui-form-label" language='DeviceInfo.d32'> 保存现场图片</label>
                        <div class="layui-input-inline">
                            <input type="checkbox" name="SaveRecordPicture" lay-skin="switch"
                                   id="device.d189" data-lang="lay-text" lay-text="启用|禁用" unchecked value="1">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <div class="layui-col-md12">
        <div class="layui-card">

            <div class="layui-card-body">
                <div class="layui-btn-container aligncenter">
                    <button type="submit" class="layui-btn layui-btn-normal" lay-submit lay-filter="btn-data-save"
                            language='DeviceInfo.d20'>
                        <i class="layui-icon"></i> 保存
                    </button>
                    <button type="button" class="layui-btn layui-btn-danger" lay-submit lay-filter="btn-data-refresh"
                            language="DeviceInfo.d21">
                        <i class="layui-icon"></i> 刷新
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>



<script>
    layui.use(['form', 'laydate', 'table', 'miniPage', 'element', 'faceAPI'], function () {

        setLanguage();
        setAllAttrVal()
        var faceAPI = layui.faceAPI;
        var form = layui.form;
        var $ = layui.$;
        var laydate = layui.laydate;
        var formdata;

        laydate.render({
            elem: '[name="AutoRestartTime"]', //指定元素
            type: 'time',
            format: 'HH:mm'
        });

        function LoadData() {
            var parameter = {
                "SystemInfo": true,
                "Storage": true
            };

            faceAPI.AjaxPOSTJson({
                url: '/api/Device/GetDetail',
                data: parameter,
                success: function (rst) {
                    if (rst != null && rst.result) {
                        rst.content.SystemTime = faceAPI.unixTimeStampToDateString(rst.content.SystemTime);

                        formdata = rst.content;
                        formdata.AutoRestartTime = formdata.AutoRestartTime ;
                        bindfrom();
                    };
                }
            });
        }

        LoadData();

        form.on('submit(btn-data-save)', function (data) {

            layer.confirm(getLanguage('DeviceInfo.d22'), { icon: 3 }, function (index, layero, that) {//'确定保存设备信息吗?'

                var postdata = data.field;
                postdata.AutoRestart = postdata.AutoRestart == '1' ? 1 : 0;
                
                postdata.AutoRestartTime = postdata.AutoRestartTime.slice(0, 5);

                postdata.RecordAutoCycle = postdata.RecordAutoCycle == '1' ? 1 : 0;
                postdata.SaveUnregistered = postdata.SaveUnregistered == '1' ? 1 : 0;
                postdata.SaveRecordPicture = postdata.SaveRecordPicture == '1' ? 1 : 0;

                //启动遮罩层
                var waitLayerIndex = layer.load(1, { shade: [0.5, '#FFF'] });
                faceAPI.AjaxPOSTJson({
                    data: postdata,
                    url: '/api/device/UpdateParameter',
                    success: function (result) {
                        layer.close(waitLayerIndex);
                        if (result.result == false) {
                            layer.alert(result.error, { icon: 2 });
                        }
                        else {
                            formdata = data.field;
                            layer.alert(getLanguage('DeviceInfo.d23'), { icon: 1 });
                        }
                    }
                });
                layer.close(index);
            });

        });
        form.on('submit(btn-data-refresh)', function (data) {

            layer.confirm(getLanguage('DeviceInfo.d24'), { icon: 3, btn: ["Yes", "No"] }, function (index, layero, that) {//'确定刷新设备信息吗?'
                LoadData();
                layer.close(index)
            });
        });


        function bindfrom() {
            var _page = $('#SystemSetting_div');
            _page.find('div[autoset]').each((ind, em) => {
                var _em = $(em);
                var name = _em.attr("name");
                if (formdata.hasOwnProperty(name))
                    _em.html(formdata[name]);
            });
            form.val("SystemSetting_div_filter", formdata);
        }

        faceAPI.CheckInputBox();
    });

</script>
