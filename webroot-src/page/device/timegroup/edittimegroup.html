<script>
    setLanguage();
    setAllAttrVal()
    layui.use(['form', 'layer', 'faceAPI', 'faceTiming', 'laydate'], function () {
        setLanguage();
        setAllAttrVal();
        var form = layui.form,
            layer = layui.layer,
            $ = layui.$;
        var faceAPI = layui.faceAPI;
        var laydate = layui.laydate;

        // 当前弹出层，防止ID被覆盖
        var parentIndex = layer.index;


        /**
         * 初始化表单，要加上，不然刷新部分组件可能会不加载
         */
        form.render();
        faceAPI.TimeGroupEditPageResult = {
            result: false
        };

        var TimeGroupAll = faceAPI.TimeGroupEditPage;
        form.val("TimeGroup_edit_div_filter", faceAPI.TimeGroupEditPage);
        
        var timeGroupPanel = layui.faceTiming.CreateTiming($, form);
        timeGroupPanel.init("TimeGroup_edit_div_filter", "TimeGroup", faceAPI.TimeGroupEditPage, laydate);



        form.on('submit(data_TimeGroup_Edit_Save_btn)', function (data) {
            if (!timeGroupPanel.SaveTimeGroup()) {
                return false;
            }
            
            faceAPI.TimeGroupEditPageResult.result = true;

            var retData = { Num: TimeGroupAll.Num };
            faceAPI.TimeGroupEditPageResult.data = { ...retData, ...timeGroupPanel.getWeekDetail() };

            layer.close(parentIndex);
            return false;
        });

        form.on('submit(data_TimeGroup_Edit_Close_btn)', function (data) {
            layer.close(parentIndex);
            return false;
        });

    });
</script>
