<div class="layuimini-main" id="DoorSensorReport-search">
    <style>
        .searchlabel {
            width: 140px;
        }

        .defcenter {
            text-align: center;
        }
    </style>
    <form class="layui-form layui-form-pane" lay-filter="DoorSensorReport_search_div_filter">

        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label searchlabel" language='Report.r95'>时间范围：</label>
                <div class="layui-input-inline">
                    <input type="text" maxlength="30" name="BeginDate" lay-verify="required" autocomplete="off"
                           class="layui-input" value="2024年1月1日">
                </div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label searchlabel" language='Report.r96'>至</label>
                <div class="layui-input-inline">
                    <input type="text" maxlength="30" name="EndDate" lay-verify="required" autocomplete="off"
                           class="layui-input">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label searchlabel" language='Report.r99'>事件类型</label>
                <div class="layui-input-block" id="RecordTypes" />

            </div>
        </div>


        <div class="layui-form-item defcenter">
            <button type="submit" class="layui-btn  " lay-submit lay-filter="data-search-btn" id="btnName" language='Report.r120'>
                搜索
            </button>
            <button type="submit" class="layui-btn layui-bg-bluey" id="btnreset" language='Report.r121'>重置</button>
            <button type="submit" class="layui-btn layui-bg-orange" id="btnsearchclose">
                <i class="layui-icon">&#x1006;</i> <span language='Report.r122'>取消</span>
            </button>
        </div>
    </form>

</div>
<script>
    setLanguage();
    setAllAttrVal()
    layui.use(['form', 'laydate', 'faceAPI', 'selectM'], function () {
        var form = layui.form,
            layer = layui.layer,
            $ = layui.$;
        var laydate = layui.laydate;
        var faceAPI = layui.faceAPI;
        var selectM = layui.selectM;
        /**
         * 初始化表单，要加上，不然刷新部分组件可能会不加载
         */
        form.render();

        //执行一个laydate实例
        laydate.render({
            elem: '[name="BeginDate"]', //指定元素
            type: 'datetime',
        });

        //执行一个laydate实例
        laydate.render({
            elem: '[name="EndDate"]', //指定元素
            type: 'datetime'
        });


        // 当前弹出层，防止ID被覆盖
        var parentIndex = layer.index;

        //动态设置选择框


        var eventMap = [];


        faceAPI.DoorSensorReportSearch.EnentTypeTable.forEach((item, index, arr) => {

            var eventItem = {};
            eventItem.id = index;
            eventItem.name = item;
            eventItem.status = 1;
            eventMap.push(eventItem);

            //console.log(eventItem);
        })

        var eventSelected = [];
        
        if (faceAPI.DoorSensorReportSearch.hasOwnProperty("RecordTypes")) {

            if (faceAPI.DoorSensorReportSearch.RecordTypes != null) {
                var sMaps = faceAPI.DoorSensorReportSearch.RecordTypes.split(",");
                eventSelected = sMaps;
            }
        }

        //多选标签-基本配置
        var tagIns1 = selectM({
            //元素容器【必填】
            elem: '#RecordTypes'
            //候选数据【必填】
            , data: eventMap
            , max: 5
            , width: 510
            , selected: eventSelected
        });




        form.val("DoorSensorReport_search_div_filter", faceAPI.DoorSensorReportSearch);

        faceAPI.DoorSensorReportSearchPageResult.result = false;




        //监听提交
        form.on('submit(data-search-btn)', function (data) {
            var result = data.field;


            result.BeginDate = dayjs(result.BeginDate, "YYYY-MM-DD HH:mm:ss").unix();
            result.EndDate = dayjs(result.EndDate, "YYYY-MM-DD HH:mm:ss").unix();
            if (result.RecordTypes == "") result.RecordTypes = null;

            faceAPI.DoorSensorReportSearchPageResult.result = true;
            faceAPI.DoorSensorReportSearchPageResult.field = result;
            layer.close(parentIndex);
            return false;
        });

        //重置
        $('#btnreset').on('click', function () {
            faceAPI.SystemReportSearch = {
                BeginDate: dayjs().subtract(7, 'day').format("YYYY-MM-DD") + ' 00:00:00',//将 年月日时分秒 转为 时间戳
                EndDate: dayjs().format("YYYY-MM-DD") + ' 23:59:59',
                RecordTypes: []
            }

            form.val("DoorSensorReport_search_div_filter", faceAPI.SystemReportSearch);

            tagIns1.set([]);
            return false;
        });


        $('#btnsearchclose').on('click', function () {
            faceAPI.DoorSensorReportSearchPageResult.result = false
            layer.close(parentIndex);
            return false;
        });





    });
</script>
