
<div class="layuimini-container layuimini-page-anim" divname="DoorSensorReport">
    <div class="layuimini-main">

        <script type="text/html" id="toolbarDemo">
            <div class="layui-btn-container">
                <button class="layui-btn layui-btn-normal layui-btn-sm data-add-btn" lay-event="search">
                    <i class="layui-icon"> </i>
                    <span language='people.p1' t="查询"></span>
                </button>

                <button class="layui-btn layui-btn-sm " lay-event="refresh" language='Report.r2' t="刷新">
                    
                </button>
                <button class="layui-btn layui-btn-sm layui-bg-red" lay-event="ClearRecord" language='Report.r174' t="删除所有记录">
                    
                </button>
            </div>
        </script>

        <table class="layui-hide" id="DoorSensorReportPage" lay-filter="DoorSensorReportPageTableFilter"> </table>
    </div>
</div>

<script>

    layui.use(['form', 'table', 'miniPage', 'element', 'faceAPI'], function () {

        var $ = layui.jquery,
            form = layui.form,
            table = layui.table,
            miniPage = layui.miniPage;
        var faceAPI = layui.faceAPI;
        var openWH = miniPage.getOpenWidthHeight();
        form.render();
        IniSearchPar();

        var EnentTypeTable = [];
        EnentTypeTable[1] = getLanguage('Report.EnentType_DoorSensor_1');//门磁-开门
        EnentTypeTable[2] = getLanguage('Report.EnentType_DoorSensor_2');//门磁-关门
        EnentTypeTable[3] = getLanguage('Report.EnentType_DoorSensor_3');//进入门磁报警检测状态
        EnentTypeTable[4] = getLanguage('Report.EnentType_DoorSensor_4');//退出门磁报警检测状态
        EnentTypeTable[5] = getLanguage('Report.EnentType_DoorSensor_5');//门未关好
        EnentTypeTable[6] = getLanguage('Report.EnentType_DoorSensor_6');//使用按钮开门
        EnentTypeTable[7] = getLanguage('Report.EnentType_DoorSensor_7');//按钮开门时门已锁定
        EnentTypeTable[8] = getLanguage('Report.EnentType_DoorSensor_8');//按钮开门时控制器已过期

        var TableCurPage = 0;

        //  debugger;
        table.render({
            elem: '#DoorSensorReportPage',
            //**************************异步请求开始***********************
            url: 'api/Record/DoorSensor/Search',
            method: 'post',
            where: faceAPI.DoorSensorReportSearchPageResult.field,
            contentType: 'application/json',
            headers: {
                //  'Content-Type': 'application/json',
                Authorization: "Bearer " + faceAPI.GetJWTToken()
            }, //增加Token验证头
            request: {
                pageName: 'PageIndex', //页码的参数名称，默认：page
                limitName: 'PageSize' //每页数据量的参数名，默认：limit
            },
            parseData: function (res) { //res 即为原始返回的数据
                if (res.result == true) {
                    var data = res.content;
                    var ret = {
                        "code": 0, //解析接口状态
                        "msg": "", //解析提示文本
                        "count": data.TotalCount, //解析数据长度
                        "data": data.DataList //解析数据列表
                    };
                    return ret;

                } else {
                    return {
                        "code": 0, //解析接口状态
                        "msg": '', //解析提示文本
                        "count": 0, //解析数据长度
                        "data": [] //解析数据列表
                    };
                }


            }, //**************************异步请求结束***********************

            toolbar: '#toolbarDemo',
            defaultToolbar: ['filter', 'exports', 'print'],
            cols: [
                [

                    {
                        field: 'RecordDate',
                        width: 200,
                        title: getLanguage('Report.r36'),
                        sort: true,
                        templet: function (d) {
                            var strDate = faceAPI.unixTimeStampToDateString(d.RecordDate);
                            return strDate;
                        }
                    },
                    { //打卡事件
                        field: 'RecordType',
                        title: getLanguage('Report.r42'),
                        sort: true,
                        templet: function (d) {
                            var sTip = EnentTypeTable[d.RecordType];

                            return sTip;
                        }
                    }
                ]
            ],
            limits: [100, 200, 300, 400, 500, 600],
            limit: 100,
            page: true,
            height: openWH[1] - 50,
            skin: 'line',
            done: function (res, curr, count) {
                TableCurPage = curr;
            }
        });



        function IniSearchPar() {
            var par = {
                field: {
                    BeginDate: dayjs(dayjs().subtract(7, 'day').format("YYYY-MM-DD") + ' 00:00:00').unix(),//将 年月日时分秒 转为 时间戳
                    EndDate: dayjs(dayjs().format("YYYY-MM-DD") + ' 23:59:59').unix(),
                    RecordTypes: null,
                },
                result: true
            };

            faceAPI.DoorSensorReportSearchPageResult = par;
        }
        /**
         * toolbar事件监听
         */
        table.on('toolbar(DoorSensorReportPageTableFilter)', function (obj) {
            if (obj.event === 'search') { // 查询操作
                var content = miniPage.getHrefContent('page/report/DoorSensorSearch.html');


                faceAPI.DoorSensorReportSearch = { ...faceAPI.DoorSensorReportSearchPageResult.field };
                faceAPI.DoorSensorReportSearch.BeginDate = dayjs.unix(faceAPI.DoorSensorReportSearch.BeginDate).format("YYYY-MM-DD HH:mm:ss");
                faceAPI.DoorSensorReportSearch.EndDate = dayjs.unix(faceAPI.DoorSensorReportSearch.EndDate).format("YYYY-MM-DD HH:mm:ss");
                faceAPI.DoorSensorReportSearch.EnentTypeTable = EnentTypeTable;
                var index = layer.open({
                    title: getLanguage('Report.SearchDoorSensorRecord'),
                    type: 1,
                    shade: 0.2,
                    maxmin: true,
                    shadeClose: true,
                    area: ['800px', '500px'],
                    content: content,
                    end: function (layero, index) {
                        if (faceAPI.DoorSensorReportSearchPageResult.result == true) {
                            TableCurPage = 1;
                            refreshTable(false);
                        }
                    }
                });

            } else if (obj.event == 'refresh') {
                //执行搜索重载
                refreshTable(true);
            } else if (obj.event == 'ClearRecord') {
                ClearRecord();
            }

        });

        function ClearRecord() {
            var layerindex = layer.confirm(getLanguage('Report.r51'), {
                btn: [getLanguage('people.p24'), getLanguage('people.p25')], //按钮 删除和取消
                icon: 3
            }, function () { //删除
                // debugger
                var CheckPasswordcontent = miniPage.getHrefContent(
                    "page/user/CheckPassword.html"
                );
                faceAPI.CheckPasswordResult = false;

                // debugger;
                layer.open({
                    title: getLanguage("user.checkPassword"),
                    type: 1,
                    shade: 0.4,
                    area: ["500px", "200px"],
                    content: CheckPasswordcontent,
                    end: function () {

                        if (faceAPI.CheckPasswordResult) {
                            sendClearRequest();
                        }

                    },
                });


                layer.close(layerindex);
            });

            function sendClearRequest() {
                var postdata = {
                    RecordType: 2 //门磁记录
                };
                var loadindex = layer.load(1, { shade: [0.6, '#e2e2e2'] });

                faceAPI.AjaxPOSTJson({
                    data: postdata,
                    url: 'api/Record/Delete/ByType',
                    timeout: 9999999,
                    success: function (result) {
                        layer.close(loadindex);
                        if (result.result == false) {
                            layer.alert(result.error, {
                                icon: 2
                            });
                        } else {
                            refreshTable(true);
                        }
                    }
                });
                layer.close(index);
            }

        }


        function refreshTable(bIni) {

            if (bIni) {
                IniSearchPar();
                TableCurPage = 1;
            }
            var rst = faceAPI.DoorSensorReportSearchPageResult;

            table.reload('DoorSensorReportPage', {
                page: {
                    curr: TableCurPage
                },
                where: rst.field
            });
        }
    });
    setLanguage();
    setAllAttrVal();
</script>
