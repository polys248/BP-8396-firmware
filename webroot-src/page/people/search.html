<script>
    setLanguage();
    setAllAttrVal()
    layui.use(['form', 'table', 'faceAPI'], function () {
        var form = layui.form,
            layer = layui.layer,
            table = layui.table,
            $ = layui.$;
        var faceAPI = layui.faceAPI;
        /**
         * 初始化表单，要加上，不然刷新部分组件可能会不加载
         */
        form.render();

        // 当前弹出层，防止ID被覆盖
        var parentIndex = layer.index;

        if (faceAPI.PeopleSearchPageResult != null) {
            form.val("people_search_div_filter", faceAPI.PeopleSearchPageResult.field);
        } else
            faceAPI.PeopleSearchPageResult = {};

        faceAPI.PeopleSearchPageResult.result = false;
        //监听提交
        form.on('submit(data-search-btn)', function (data) {
            var result = data.field;
            faceAPI.PeopleSearchPageResult = {};
            
            if (result.CardNum == "") result.CardNum = null;
            if (result.CardNum == "0") result.CardNum = null;
            if (result.UserID == "") result.UserID = null;
            if (result.UserID == "0") result.UserID = null;
            if (result.Code == "") result.Code = null;
            if (result.Name == "") result.Name = null;
            if (result.IdentityCard == "") result.IdentityCard = null;

            if (result.Department == "") result.Department= null;

            if (result.Photo == "")  result.Photo= null;
            if (result.AccessType == "") result.AccessType = null;
            if (result.Fingerprint == "") result.Fingerprint = null;
            if (result.Palmprint == "") result.Palmprint = null;

            faceAPI.PeopleSearchPageResult.result = true;
            faceAPI.PeopleSearchPageResult.field = result;
            layer.close(parentIndex);
            return false;
        });


        $('#btnsearchclose').on('click', function () {
            faceAPI.PeopleSearchPageResult.result = false
            layer.close(parentIndex);
            return false;
        });

        //删除不支持的功能
        if (faceAPI.DeviceFunctionList != undefined) {
            const { Card, Fingerprint, Palmvein, UserCode } = faceAPI.DeviceFunctionList;
            //设备不支持人员编号
            if (!UserCode) {
                faceAPI.removeElement('.FunctionList_UserCode');
            }
            //设备不支持刷卡
            if (!Card) {
                faceAPI.removeElement('.FunctionList_Card');
            }
            //设备不支持指纹
            if (!Fingerprint) {
                faceAPI.removeElement('.FunctionList_Fingerprint');
            }
            //设备不支持指纹
            if (!Palmvein) {
                faceAPI.removeElement('.FunctionList_Palmvein');
            }
        }

        // $('#btn-reset').on('click', function () {
        //     form.render("people_search_div_filter",{
        //         EmployeeIC:"",
        //         UserID:"",
        //         Name:"",
        //         UserIDentity:"",
        //         employeeDept:""

        //     });
        //     return false;
        // });
        faceAPI.CheckInputBox();
    });

</script>
