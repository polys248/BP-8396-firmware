<script>
    setLanguage();
    setAllAttrVal();


    layui.use(
        ["form", "upload", "table", "miniPage", "faceAPI", "slider", "laydate"],
        function () {
            // debugger
            var $ = layui.jquery;
            var form = layui.form,
                layer = layui.layer,
                miniPage = layui.miniPage,
                table = layui.table;
            var faceAPI = layui.faceAPI;
            var imageTool = ImageUtility();
            var laydate = layui.laydate;
            var TimeGroups = [];
            var parentIndex = layer.index;
            var $el = layui.element;

            var bUpdatePhoto = false;
            var bIsNew = true;

            var peopleDetail = {};
            faceAPI.PeopleEditPageResult = {};
            /**
             * 初始化表单，要加上，不然刷新部分组件可能会不加载
             */
            form.render();

            var formDataobj = {};

            var peopleEdit = {
                setParentIndex(index) {
                    parentIndex = index;
                },

                /**
                 * 创建时段下拉框
                 * @param {any} name
                 */
                createTimeGroup: function (name) {
                    let num = 65;
                    // faceAPI.DeviceFunctionList.TimeGroup=10
                    if (faceAPI?.DeviceFunctionList?.TimeGroup !== undefined) {
                        num = Number(faceAPI.DeviceFunctionList.TimeGroup) + 1;
                    }

                    var timeGroupOptions = [];
                    for (var i = 1; i < num; i++) {
                        var sItem = '<option value="' + i + '"';
                        if (i == 1) sItem += ' selected';
                        sItem += '>' + getLanguage("access.a94") + i + '</option>';
                        timeGroupOptions.push(sItem);
                    }

                    var selectElement = $('[name="' + name + '"]');
                    if (selectElement.length > 0) {
                        selectElement.html(timeGroupOptions.join(''));
                        form.render('select');
                    }
                },

                /**
                 * 创建时间控件
                 * @param {any} name
                 */
                createLaydate(name, value) {
                    laydate.render({
                        elem: '[name="' + name + '"]', //指定元素
                        type: "datetime",
                        format: 'yyyy-MM-dd HH:mm:ss',
                        min: '2024-01-01',
                        max: '2099-12-31 23:59:59',
                        fullPanel: true

                    });
                    $('[name="' + name + '"]').attr("value", value);
                },
                /**
                 * 创建表格
                 * @param {*} elem  tableid
                 * @param {*} title  标题
                 * @param {*} data  数据
                 */
                CreateTable(elem, title, data) {
                    table.render({
                        elem: "#" + elem,
                        cols: [
                            [
                                //标题栏
                                { type: "checkbox", width: 60 },
                                { field: "num", title: title },
                            ],
                        ],
                        data: data,
                        height: 430,
                        limit: 1000, // 每页默认显示的数量
                    });
                    return table;
                },
                /**
                 * 创建表格数据
                 * @param {*} len
                 * @param {*} checked
                 * @returns
                 */
                CreateTableData: function (len, checked) {
                    if (checked == undefined) checked = [];
                    var data = [];
                    for (var i = 1; i <= len; i++)
                        data.push({
                            LAY_CHECKED: checked.includes(i.toString()),
                            num: i,
                        });
                    return data;
                },
                createfeatureTabel: function (data) {
                    var fieldtype = getLanguage("people.p101");
                    var fielddata = getLanguage("people.p103");
                    var fieldnum = getLanguage("people.p102");
                    var fieldAction = getLanguage("people.p104");
                    var that = this;
                    var tableId = "Table_feature";
                    table.render({

                        elem: "#Table_feature",
                        cols: [
                            [
                                {
                                    type: "checkbox",
                                    width: 50
                                },
                                //标题栏
                                { field: "name", title: fielddata },
                                { title: fieldAction, width: 200, toolbar: "#featureTableBar" },
                            ],
                        ],
                        done: function (res, curr, count) {
                            setLanguage();
                        },

                        data: data,
                        height: 430,
                        limit: 60, // 每页默认显示的数量
                    });

                    $('#BtnFeatureAdd').off('click');
                    $('#BtnFeatureAdd').on('click', function () {
                        var content = miniPage.getHrefContent(
                            "page/people/AddFeature.html"
                        );

                        var Features = layui.table.cache[tableId];

                        faceAPI.PeopleFeatureWindowData = { Save: false, Features: Features }

                        // debugger;
                        var layerindex = layer.open({
                            title: getLanguage("people.AddFeatureCode"),
                            type: 1,
                            shade: 0.2,
                            // maxmin: true,
                            shadeClose: true,
                            area: ["800px", "730px"],

                            content: content,
                            end: function () {
                                if (faceAPI.PeopleFeatureWindowData.Save) {
                                    table.reload(tableId, { data: faceAPI.PeopleFeatureWindowData.Features });
                                }

                            },
                        });
                        return false;
                    });
                    $('#BtnFeatureDelete').off('click');
                    $('#BtnFeatureDelete').on('click', function () {
                        //debugger
                        var checkStatus = table.checkStatus(tableId),
                            data = checkStatus.data;
                        var features = [];

                        data.forEach(function (item, index) {

                            features[item.type + "_" + item.num] = 1;
                        });
                        if (data.length == 0) {
                            layer.alert(getLanguage('people.DeleteFeatureCodeErr'), { icon: 2 });
                            return false;
                        }

                        var oldDatas = layui.table.cache[tableId];
                        var oldDatesLen = oldDatas.length;
                        for (var i = oldDatesLen - 1; i >= 0; i--) {
                            console.log(oldDatas[i]);

                            var strKey = oldDatas[i].type + "_" + oldDatas[i].num;


                            if (features[strKey] == 1) {
                                oldDatas.splice(i, 1);
                            }

                        }
                        console.log("刷新表格")
                        table.reload(tableId, { data: oldDatas });
                        return false;
                    });

                    $('#BtnFeatureClear').off('click');
                    $('#BtnFeatureClear').on('click', function () {
                        table.reload(tableId, { data: [] });
                        return false;
                    });
                    $('#BtnEnrollUserOnDevice').off('click');
                    $('#BtnEnrollUserOnDevice').on('click', function () {
                        var content = miniPage.getHrefContent(
                            "page/people/SelectFeature.html"
                        );



                        faceAPI.PeopleFeatureWindowData = { Save: false }

                        // debugger;
                        var layerindex = layer.open({
                            title: getLanguage("people.SelectEnrollFeature"),
                            type: 1,
                            shade: 0.2,
                            // maxmin: true,
                            shadeClose: true,
                            area: ["580px", "450px"],

                            content: content,
                            end: function () {
                                if (faceAPI.PeopleFeatureWindowData.Save) {
                                    console.log(faceAPI.PeopleFeatureWindowData.type)
                                    var sRetType = faceAPI.PeopleFeatureWindowData.type;
                                    var iDataType = 1;
                                    var iIndex = 1;
                                    if (sRetType != "Face") {

                                        iDataType = 2;//指纹
                                        iIndex = 0;
                                        if (sRetType == "Palm") {
                                            iDataType = 3;//掌静脉
                                            iIndex = 1;
                                        }

                                        var bFind = true;

                                        //获取注册特征的索引号
                                        var oldDatas = layui.table.cache[tableId];
                                        var oldDatesLen = oldDatas.length;
                                        do {
                                            bFind = true;
                                            for (var i = 0; i < oldDatesLen; i++) {

                                                if (oldDatas[i].type == iDataType &&
                                                    oldDatas[i].num == iIndex) {
                                                    iIndex++;//被占用，跳过
                                                    bFind = false;
                                                    break;
                                                }

                                            }
                                            if (bFind) break;
                                        } while (true);
                                        if (sRetType == "Palm") {
                                            if (iIndex > 2) {
                                                layer.alert(getLanguage("people.PalmCountError"), { icon: 2 });
                                                return false;
                                            }
                                        }
                                        if (sRetType == "FP") {
                                            if (iIndex > 2) {
                                                layer.alert(getLanguage("people.FingerprintCountError"), { icon: 2 });
                                                return false;
                                            }
                                        }
                                    }


                                    //通知设备
                                    EnrollUserMediaData(sRetType, iIndex);
                                }

                            },
                        });
                        return false;
                    });




                    table.on("tool(ID-table-feature)", function (obj) {
                        var data = obj.data;

                        if (obj.event === "edit") {
                            //显示特征码详情
                            that.openFeatureWindow(tableId, data);
                        } else if (obj.event === "delete") {
                            //删除特征码
                            layer.alert(
                                getLanguage("people.DeleteFeatureTip") + "[" + data.name + "]?",
                                { icon: 3 },
                                function (alertindex) {
                                    var oldDatas = layui.table.cache[tableId];
                                    var oldDatesLen = oldDatas.length;
                                    for (var i = 0; i < oldDatesLen; i++) {

                                        if (oldDatas[i].type == data.type &&
                                            oldDatas[i].num == data.num) {
                                            oldDatas.splice(i, 1);
                                            break;
                                        }

                                    }

                                    table.reload(tableId, { data: oldDatas });
                                    layer.close(alertindex);
                                }
                            );
                        }
                        return false;
                    });
                },
                /**
                 *
                 * 根据用户ID获取用户信息
                 */
                GetUserDetail: function () {
                    var that = this;
                    if (faceAPI.PeopleEditPage == undefined) {
                        var elevatorData = this.CreateTableData(64);
                        this.CreateTable(
                            "ID-table-Elevator",
                            getLanguage("people.p94"),
                            elevatorData
                        ); //'电梯端口'
                        var HolidaysData = this.CreateTableData(30);
                        this.CreateTable(
                            "ID-table-Holidays",
                            getLanguage("people.p95"),
                            HolidaysData
                        ); //'节假日序号'
                        this.createfeatureTabel([]);

                        var fromdata = {
                            ExpirationDate: "2099-12-31 00:00:00",
                            OpenTimes: 65535,
                        };
                        form.val("people_edit_div_filter", fromdata);


                        //获取新用户ID
                        var loadIndex = layer.load(1, { shade: [0.6, "#e2e2e2"] }); //0.1透明度的白色背景
                        faceAPI.AjaxPOSTJson({
                            url: "/api/People/GetNewID",
                            success: function (result) {
                                layer.close(loadIndex);
                                fromdata.UserID = result.content.NewUserID;
                                form.val("people_edit_div_filter", fromdata);
                            },
                        });
                        bIsNew = true;

                        return;

            function resizeImage(img, maxWidth, maxHeight) {
                let width = img.width;
                let height = img.height;

                // 计算宽高比
                var aspectRatio1 = maxWidth / width;
                var aspectRatio2 = maxHeight / height;

                if (aspectRatio1 > aspectRatio2) {
                    aspectRatio1 = aspectRatio2
                }
                height = Math.round(height * aspectRatio1);
                width = Math.round(width * aspectRatio1);

                return { width, height };
            }

            function compressAndUploadImage(img, maxWidth, maxHeight) {

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                const newSize = resizeImage(img, maxWidth, maxHeight);

                canvas.width = maxWidth;
                canvas.height = maxHeight;
                // 设置背景色
                ctx.fillStyle = '#FFFFFF'; // 你可以将颜色值改为你需要的背景色
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // 计算图像居中的位置
                const offsetX = (maxWidth - newSize.width) / 2;
                const offsetY = (maxHeight - newSize.height) / 2;

                ctx.drawImage(img, offsetX, offsetY, newSize.width, newSize.height);
                //console.log('图片最终尺寸:', newSize);
                // 返回压缩后的图片
                const previewUrl = canvas.toDataURL('image/jpeg', 1);

                return previewUrl;
            }

            //绑定人脸录入按钮
            $("#btnEnrollUserFaceOnDevice").on("click", btnEnrollUserFaceOnDevice_click);
            $("#btnEnrollUserCardOnDevice").on("click", btnEnrollUserCardOnDevice_click);
            $("#btnEnrollUserPINOnDevice").on("click", btnEnrollUserPINOnDevice_click);

            function btnEnrollUserFaceOnDevice_click() {

                EnrollUserMediaData("Face", 1);

            }

            function btnEnrollUserCardOnDevice_click() {
                EnrollUserMediaData("Card", 1);

            }
            function btnEnrollUserPINOnDevice_click() {
                EnrollUserMediaData("PIN", 1);

            }

            function EnrollUserMediaData(type, index) {
                if (bIsNew) {
                    layer.alert(getLanguage("people.EnrollUserMediaDataTip"), { icon: 1 });
                    return;
                }
                var postdata =
                {
                    "UserID": peopleDetail.UserID,
                    "EnrollType": type,
                    "EnrollIndex": index
                }

                //获取新用户ID
                var loadIndex = layer.load(1, { shade: [0.6, "#e2e2e2"] }); //0.1透明度的白色背景
                faceAPI.AjaxPOSTJson({
                    url: "/api/People/EnrollUserMediaData",
                    data: postdata,
                    success: function (result) {
                        layer.close(loadIndex);
                        console.log(result);
                        if (result.result) {
                            var regResult = result.content.Result;
                            if (regResult == 1) {
                                layer.alert(getLanguage("people.EnrollUserMediaDataSuccess"), {
                                    icon: 1,
                                    end: function () {
                                        console.log("重新加载人员信息");
                                        peopleEdit.GetUserDetail();
                                        return;
                                    }
                                });
                            }

                            if (regResult == 2) {
                                layer.alert(getLanguage("people.EnrollUserMediaDataFail"), {
                                    icon: 2,
                                    end: function () {
                                        //console.log("EnrollUserMediaDataFail 弹框12313123");
                                        return;
                                    }
                                });

                            }
                            if (regResult == 3) {
                                layer.alert(getLanguage("people.EnrollUserMediaDataRepetition") + result.content.Repetition, {
                                    icon: 2,
                                    end: function () {
                                        //console.log("EnrollUserMediaDataRepetition 弹框12313123");
                                        return;
                                    }
                                });
                            }

                        }
                        else {
                            layer.alert(getLanguage("people.EnrollUserMediaDataFail") + '<br>' + result.error, { icon: 2 });
                        }

                    },
                });
            }
        }
    );
</script>
