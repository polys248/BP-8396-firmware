<div class="layuimini-main" id="access-search">

    <form class="layui-form layui-form-pane" lay-filter="access-search_div_filter">
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label" style="width: 200px;" language='user.editpassword_1'>旧密码</label>
                <div class="layui-input-inline">
                    <input type="password" 
                        lay-verify="required|numberLength" 
                        minlength="4" 
                        maxlength="8" 
                        name="OldPassword" 
                        autocomplete="off"
                        lay-reqtext="旧密码不能为空" 
                        placeholder="请输入4-8位数字密码"
                        id="user.editpassword_2,user.editpassword_3" 
                        data-lang='lay-reqtext,placeholder'
                        class="layui-input"
                        oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label" style="width: 200px;" language='user.editpassword_4'>新密码</label>
                <div class="layui-input-inline">
                    <input type="password" 
                           lay-verify="required|numberLength" 
                           minlength="4" 
                           maxlength="8" 
                           name="NewPassword" 
                           autocomplete="off"
                           lay-reqtext="新的密码不能为空" 
                           placeholder="请输入4-8位数字密码"
                           id="user.editpassword_5,user.editpassword_6" 
                           data-lang='lay-reqtext,placeholder'
                           class="layui-input"
                           oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label" style="width: 200px;" language='user.editpassword_7'>确认密码</label>
                <div class="layui-input-inline">
                    <input type="password" 
                           lay-verify="required|numberLength" 
                           minlength="4" 
                           maxlength="8" 
                           name="NewPassword2" 
                           autocomplete="off"
                           lay-reqtext="确认密码不能为空" 
                           placeholder="请再次输入4-8位数字密码"
                           id="user.editpassword_8,user.editpassword_9" 
                           data-lang='lay-reqtext,placeholder'
                           class="layui-input"
                           oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline">
                <button type="submit" class="layui-btn layui-btn-primary" lay-submit lay-filter="data-search-btn">
                    <i class="layui-icon">&#xe605;</i>
                    <span language='user.editpassword_10'> 保存</span>
                </button>
            </div>
        </div>
    </form>

</div>
<script src="/jsLib/crypto-js.js"></script>
<script>
    setLanguage();
    setAllAttrVal()
    layui.use(['form', 'table', 'faceAPI'], function () {
        var form = layui.form,
            layer = layui.layer,
            table = layui.table,
            $ = layui.$;
        var faceAPI = layui.faceAPI;
        /**
         * 初始化表单，要加上，不然刷新部分组件可能会不加载
         */
        form.render();


        //监听提交
        form.on('submit(data-search-btn)', function (data) {
            var sendPar = data.field;
            if (sendPar.OldPassword == sendPar.NewPassword2) {
                layer.alert(getLanguage('user.editpassword_13'), { icon: 2 });//'新密码不能和旧密码相同'
                return false;
            }
            if (sendPar.NewPassword != sendPar.NewPassword2) {
                layer.alert(getLanguage('user.editpassword_14'), { icon: 2 });// '两次输入的新密码不一致'
                return false;
            }

            faceAPI.AjaxPOSTJson({
                url: '/api/User/EditPassword',
                data: sendPar,
                success: function (result) {

                    if (result.result == false) {
                        var errMsgs = [];
                        errMsgs[1] = getLanguage('user.editpassword_15')//"旧密码输入错误！";
                        errMsgs[2] = getLanguage('user.editpassword_16')//"新密码输入错误！";
                        errMsgs[3] = getLanguage('device.password_check_err4')//管理密码太简单，需要大写字母+小写字母+数字+特殊符号组合！

                        if (result.errCode <= 2) {
                            layer.alert(errMsgs[result.errCode], { icon: 2 });
                        }
                        else {
                            layer.alert(result.error, { icon: 2 });
                        }
                    }
                    else {
                        layer.alert(getLanguage('user.editpassword_11'), { icon: 1 }, function () {

                            var load_index = layer.load(1, { shade: [0.5, '#FFF'] });

                            faceAPI.Ajax({
                                type: 'Get',
                                url: '/api/User/Logout',
                                success: function (result) {
                                    layer.close(load_index);
                                    layer.msg(getLanguage('Login.l14'), function () {
                                        faceAPI.GotoLogin(false);
                                    });
                                }
                            })
                            
                        });// '修改成功，请重新登录系统'
                        
                    }

                }
            });

            return false;
        });


        faceAPI.CheckInputBox();

    });

</script>
