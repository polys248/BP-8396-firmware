<div class="layuimini-main" id="access-search">

    <form class="layui-form layui-form-pane" lay-filter="user_check_div_filter">
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label" style="width: 200px;" language='user.checkpassword_1'>管理密码</label>
                <div class="layui-input-inline">
                    <input type="password" lay-verify="required" maxlength="32" name="AdminPassword" autocomplete="off"
                           class="layui-input">
                </div>
            </div>
        </div>
        <div class="layui-form-item" style="text-align: center;">
            <div class="layui-inline">
                <button type="submit" class="layui-btn layui-btn-primary" lay-submit lay-filter="data-check-btn">
                    <i class="layui-icon">&#xe605;</i>
                    <span language='user.checkpassword_2'> 验证</span>
                </button>
            </div>
        </div>
    </form>

</div>
<script src="/jsLib/crypto-js.js"></script>
<script>
    setLanguage();
    setAllAttrVal()
    layui.use(['form', 'table', 'faceAPI'], function () {
        var form = layui.form,
            layer = layui.layer,
            table = layui.table,
            $ = layui.$;
        var faceAPI = layui.faceAPI;
        /**
         * 初始化表单，要加上，不然刷新部分组件可能会不加载
         */
        form.render();

        var parentIndex = layer.index;

        //监听提交
        form.on('submit(data-check-btn)', function (data) {
            var sendPar = data.field;
            //AdminPassword

            // 将密码加盐混淆后发送
            //创建密码盐
            var sHash = generateGUID();
            var sMessage = sHash + sendPar.AdminPassword + sHash;
            var ciphertext = CryptoJS.MD5(sMessage).toString(CryptoJS.enc.Hex).toUpperCase();
            sendPar.AdminPassword = ciphertext;
            sendPar.Hash = sHash;

            faceAPI.AjaxPOSTJson({
                url: '/api/User/CheckAdminPassword',
                data: sendPar,
                success: function (result) {

                    if (result.result == false) {
                        var errMsgs = [];
                        errMsgs[1] = getLanguage('user.checkpassword_3')//"密码输入错误！";

                        if (result.errCode <= 1) {
                            layer.alert(errMsgs[result.errCode], { icon: 2 });
                        }
                        else {
                            layer.alert(result.error, { icon: 2 });
                        }
                    }
                    else {
                        
                        faceAPI.CheckPasswordResult = true;
                        layer.close(parentIndex);
                    }

                }
            });

            return false;
        });

        faceAPI.CheckInputBox();

        function generateGUID() {
            let d = new Date().getTime();
            let uuid = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
                let r = (d + Math.random() * 16) % 16 | 0;
                d = Math.floor(d / 16);
                return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
            });
            return uuid;
        }

    });

</script>
